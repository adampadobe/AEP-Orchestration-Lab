<!--
  ============================================================
  TEMPLATE: cover-adobe-brand.html
  Scene type: brand-sting
  Figma source: Frame 1 — Intro_01 (node 5510:57665)

  Background: Solid Adobe Red (#EB1000)
  Use for: Opening brand moment, chapter zero

  Slots:
    {{product_name}}      — large centred display text (e.g. "Adobe Experience Platform")
    {{tagline}}           — subtitle line (e.g. "Real-time customer intelligence")
    {{adobe_symbol_path}} — path to assets/adobe/symbol-white.svg

  Nav dots: white variant, dot 1 active
  ============================================================
-->

<style>
/* === BRAND STING TEMPLATE === */

.slide--brand-sting {
  background: #EB1000;
  font-family: 'Adobe Clean', 'Source Sans 3', sans-serif;
}

/* ---- Top nav bar ---- */
.brand-sting__nav {
  position: absolute;
  top: 39px;
  left: 60px;
  display: flex;
  align-items: center;
  gap: 20px;
  z-index: 10;
}

.brand-sting__logo {
  width: 65.6px;
  height: 64px;
  display: block;
  flex-shrink: 0;
}

/* ---- Giant product name — centred ---- */
.brand-sting__title {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -54%); /* slightly above true centre, matching Figma */
  font-size: 318px;
  font-weight: 800; /* ExtraBold */
  line-height: 1;
  color: #FFFFFF;
  white-space: nowrap;
  text-align: center;
  letter-spacing: -0.01em;
  margin: 0;
  /* Entrance animation */
  animation: brand-sting-title-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* ---- Tagline — lower third ---- */
.brand-sting__tagline {
  position: absolute;
  bottom: 160px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 30px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.80);
  white-space: nowrap;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  margin: 0;
  animation: brand-sting-tagline-in 700ms 200ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* ---- Nav dots — white variant, left edge ---- */
/*
  Dots are centred vertically in a 695px column, left: 30px.
  White variant: active = rgba(255,255,255,0.8) with border
                 normal = white at 20% opacity
*/
.nav-dots--light {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  height: 695px;
}

.nav-dots--light .nd {
  width: 4.4px;
  height: 4.4px;
  border-radius: 62.8px;
  background: rgba(255, 255, 255, 0.20);
  flex-shrink: 0;
  display: block;
}

.nav-dots--light .nd.nd--active {
  background: rgba(255, 255, 255, 0.80);
  outline: 3px solid rgba(255, 255, 255, 0.80);
  outline-offset: 0;
}

/* ---- Entrance animations ---- */
@keyframes brand-sting-title-in {
  from { opacity: 0; transform: translate(-50%, -44%); }
  to   { opacity: 1; transform: translate(-50%, -54%); }
}

@keyframes brand-sting-tagline-in {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0);    }
}
</style>

<!-- ============================================================
     SLIDE: Brand Sting
     Active when: first slide in deck
     Replace {{slots}} before use
     ============================================================ -->
<section class="slide slide--brand-sting" id="slide-brand-sting" data-scene="brand-sting">

  <!-- Adobe logo — top left -->
  <nav class="brand-sting__nav" aria-label="Adobe">
    <img class="brand-sting__logo"
         src="{{adobe_symbol_path}}"
         alt="Adobe">
  </nav>

  <!-- Giant product name -->
  <h1 class="brand-sting__title">{{product_name}}</h1>

  <!-- Tagline -->
  <p class="brand-sting__tagline">{{tagline}}</p>

  <!-- Nav dots — white variant, 10 dots, first active -->
  <div class="nav-dots--light" role="presentation" aria-hidden="true">
    <span class="nd nd--active"></span>
    <span class="nd"></span>
    <span class="nd"></span>
    <span class="nd"></span>
    <span class="nd"></span>
    <span class="nd"></span>
    <span class="nd"></span>
    <span class="nd"></span>
    <span class="nd"></span>
    <span class="nd"></span>
  </div>

</section>
