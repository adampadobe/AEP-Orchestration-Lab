<!-- elements/living-phone.html - the "right message, right moment" beat as one living phone:
     locked, then the push arrives, then the app opens, then done (T14 of the interactive
     backlog, 19 Jul 2026; app screen fleshed out to a real product page + notification-exit
     fix + image/logo/size slots, 20 Jul).

     WHEN TO USE: the arriving-notification beat every journey story has (Monzo's nudge,
     KSIA's gate change, Northwind's reroute), made presenter-driven instead of a timed
     animation. One nudge, one tap, one done, at the presenter's pace.

     PROVENANCE: BUILT BY EXTRACTION (the T14 Design pass was rejected): shell proportions
     from mobile-phone-frame, status cluster from phone-statusbar, a generic centred
     hole-punch front camera, notification card pattern from mobile-lockscreen-notification,
     and choreography from the T14 prompt spec. Generic rounded frame, hole-punch camera (NOT
     an Apple notch/Dynamic Island), asset-licensing safe.

     CHOREOGRAPHY: idle wallpaper drifts imperceptibly (the only loop). push() wakes the
     screen, drops the notification with overshoot, a shadow bloom, a 2px haptic nudge and
     one white ring pulse. open() lifts the notification up and OFF the screen (it does not
     linger) while the lock clock blurs away and a real product screen builds in beneath it,
     its sections cascading. act() presses the button, draws the check with a soft pulse and
     slides the confirmation and receipt up. reset() reverses fast. Transforms and opacity
     only; every duration in LPM_DATA; every call interruptible.

     DATA-DRIVEN, RESKINNABLE. All copy, times and durations live in LPM_DATA. Two banked
     sample shapes ship with it: "home-restock" (physical retail, in-store hold) and
     "fashion-restock" (online apparel, back-in-your-size); pick one with window.LPM_PRESET
     (default home-restock). A deck can instead override the WHOLE object with window.LPM_DATA
     before this element runs (the asos-living-phone demo does exactly that). app supports:
       logo        optional image url/data-uri for the app bar brand (else app.name text)
       heroImage   optional product photo url/data-uri (else a token gradient placeholder)
       inStock     optional pill on the hero ("Back in stock", "New in")
       eyebrow     optional brand line above the product name (e.g. "ASOS DESIGN")
       product / productSub / price   the product meta
       options     optional chips ["S","M",{label:"L",active:true},...]; one active looks picked
       callout     {icon: pin|truck|clock|tag, name, sub}   the availability / delivery card
       action / confirmation / receipt   the CTA and its done state
       followUp    optional {icon,prompt,sub,cta,confirm}: an opt-in value offered AFTER the
                   action (the AJO beat, e.g. a reminder before a delivery cutoff); tapping
                   its button confirms in place and never advances the phone
     The app also carries fixed chrome a real app has: a bottom tab bar (the bag tab shows a
     count once done) and a home indicator.
     Product photography is a data slot ON PURPOSE: shipped decks drop LICENSED imagery in;
     the sample and demo use a self-contained studio placeholder (asset-licensing.md).

     LOCK-SCREEN WALLPAPER: LPM_DATA.wallpaper (top level, optional) is a fixed lock image so
     EVERY phone in a deck can share one standardised wallpaper (with a legibility scrim). Set
     it to the deck's standard lock image for consistency; leave it unset for the brand-token
     gradient. Kept as a per-deck slot, not a baked-in default, so no branded/licensed image
     ships inside the banked component (asset-licensing.md).

     RESKIN CONTRACT: colour from the role tokens (--brand/--brand-deep/--brand-rgb/--accent/
     --accent-lt/--accent-rgb/--ink/--grey with fallbacks). Frame bezel, app whites and greys
     are fixed neutrals (generic device).

     API (no global key bindings ON PURPOSE; the phone itself is the tap surface: tap the
     screen to wake, the card to open, the button to act):
       LPM.push()   - the notification arrives
       LPM.open()   - the notification lifts away and the app screen builds in
       LPM.act()    - take the one action, land on done
       LPM.play()   - the whole moment as one take, presenter hands-free
       LPM.reset()  - re-lock the phone fast -->
<style>
  .lpm{position:relative; width:420px; height:860px; background:#0B1526; border-radius:54px;
    padding:14px; box-shadow:0 30px 70px rgba(10,20,40,.38); user-select:none; text-align:left;
    font-family:'Adobe Clean','Source Sans 3',system-ui,sans-serif; cursor:pointer;}
  .lpm *{box-sizing:border-box; margin:0;}
  .lpm.nudge{animation:lpmNudge var(--d-nudge,90ms) ease-out 1;}
  @keyframes lpmNudge{0%{transform:translateY(0);}45%{transform:translateY(2px);}100%{transform:translateY(0);}}
  .lpm.fast *{transition-duration:var(--d-back,180ms) !important; transition-delay:0ms !important;
    animation:none !important;}
  .lpm-screen{position:relative; width:100%; height:100%; border-radius:41px; overflow:hidden;
    background:#101B30;}
  /* generic front camera: a centred hole-punch (NOT an Apple notch/Dynamic Island - device
     frames stay generic, asset-licensing.md). Sits in the centre gap of the status bar. */
  .lpm-cam{position:absolute; top:15px; left:50%; margin-left:-7.5px; width:15px; height:15px;
    border-radius:50%; z-index:9;
    background:radial-gradient(circle at 38% 34%, #3a4868 0%, #0a1020 55%, #04060b 100%);
    box-shadow:0 0 0 1.6px rgba(206,219,242,.45), 0 1px 4px rgba(0,0,0,.5);}

  /* wallpaper: token gradient with the sanctioned imperceptible drift (the only loop) */
  .lpm-wall{position:absolute; inset:0; background:
    linear-gradient(160deg, rgba(var(--brand-rgb,76,67,214),.94), rgba(var(--accent-rgb,15,165,127),.55));
    background-size:170% 170%; animation:lpmDrift 45s ease-in-out infinite alternate;}
  @keyframes lpmDrift{0%{background-position:0% 0%;}100%{background-position:100% 100%;}}
  /* standardised image wallpaper (LPM_DATA.wallpaper): a fixed lock-screen image, drift off,
     with a soft scrim so the white clock/date stay legible over any region of it. */
  .lpm-wall.lpm-wall-img{background:#0B1526 center/cover no-repeat; animation:none;}
  .lpm-wall.lpm-wall-img::after{content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,10,20,.34) 0%, rgba(6,10,20,.04) 26%, rgba(6,10,20,.10) 68%, rgba(6,10,20,.42) 100%);}
  .lpm-dim{position:absolute; inset:0; background:#000; opacity:.32; z-index:2;
    transition:opacity var(--d-wake,180ms) ease;}
  .lpm.is-notified .lpm-dim{opacity:0;}

  /* status cluster (from phone-statusbar); the .lpm-cam hole-punch sits in its centre gap */
  .lpm-status{position:absolute; top:0; left:0; right:0; z-index:8; height:46px; display:flex;
    align-items:center; justify-content:space-between; padding:8px 26px 0; font-size:15px;
    font-weight:700; color:#fff; transition:color 260ms ease;}
  .lpm.is-open .lpm-status{color:var(--ink,#20222B);}
  .lpm-sig{display:flex; align-items:center; gap:7px;}
  .lpm-sig svg{display:block; fill:currentColor;}

  /* lock layer */
  .lpm-lock{position:absolute; left:0; right:0; top:96px; z-index:3; text-align:center;
    color:#fff; transition:opacity 240ms ease, filter 240ms ease;}
  .lpm-clock{font-size:82px; font-weight:700; letter-spacing:-.02em; line-height:1;}
  .lpm-date{font-size:17px; font-weight:600; opacity:.85; margin-top:8px;}
  .lpm.is-open .lpm-lock{opacity:0; filter:blur(8px); pointer-events:none;}

  /* the notification: drops in on push, LIFTS AWAY on open (it does not stay) */
  .lpm-notif{position:absolute; left:16px; right:16px; top:300px; z-index:7;
    background:rgba(255,255,255,.97); border-radius:20px; padding:14px 16px; display:flex;
    gap:12px; align-items:flex-start; transform:translateY(-480px);
    box-shadow:0 4px 12px rgba(0,0,0,.12);
    transition:transform var(--d-drop,420ms) cubic-bezier(.2,.9,.3,1.12),
      box-shadow var(--d-drop,420ms) ease, opacity var(--d-exit,220ms) ease;}
  .lpm.is-notified .lpm-notif{transform:translateY(0); box-shadow:0 18px 44px rgba(0,0,0,.35);}
  .lpm.is-open .lpm-notif{transform:translateY(-360px); opacity:0; pointer-events:none;
    transition:transform var(--d-exit,220ms) cubic-bezier(.4,0,1,.5),
      opacity var(--d-exit,220ms) ease;}
  .lpm-nicon{flex:none; width:40px; height:40px; border-radius:10px;
    background:var(--brand,#4C43D6); color:#fff; font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .lpm-nicon img{width:100%; height:100%; object-fit:cover;}
  .lpm-napp{font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--grey,#6B6F7B);}
  .lpm-nhead{font-size:15.5px; font-weight:800; color:var(--ink,#20222B); margin:2px 0;}
  .lpm-nprev{font-size:13px; color:var(--grey,#6B6F7B); line-height:1.35;}
  .lpm-nwhen{margin-left:auto; flex:none; font-size:12px; font-weight:600; color:var(--grey,#6B6F7B);}

  /* one white ring pulse where the card lands */
  .lpm-ring{position:absolute; left:50%; top:346px; z-index:5; width:70px; height:70px;
    margin:-35px 0 0 -35px; border-radius:50%; border:3px solid rgba(255,255,255,.9);
    opacity:0; transform:scale(.4); pointer-events:none;}
  .lpm-ring.pulse{animation:lpmRing var(--d-ring,600ms) ease-out 1;}
  @keyframes lpmRing{0%{opacity:.9; transform:scale(.4);}100%{opacity:0; transform:scale(2.1);}}

  /* the app screen: a real product page */
  .lpm-app{position:absolute; inset:0; z-index:4; background:#FFFFFF; opacity:0;
    pointer-events:none; transition:opacity var(--d-app,260ms) ease;}
  .lpm.is-open .lpm-app{opacity:1; pointer-events:auto;}
  .lpm-appinner{position:absolute; inset:0; padding:52px 20px 96px; overflow:hidden;}

  .lpm-appbar{display:flex; align-items:center; gap:12px; height:34px;}
  .lpm-back{flex:none; width:30px; height:30px; border-radius:9px; background:#F1F2F5;
    display:flex; align-items:center; justify-content:center; color:var(--ink,#20222B);}
  .lpm-brand{flex:1; display:flex; align-items:center;}
  .lpm-logo{height:17px; width:auto;}
  .lpm-appname{font-size:15px; font-weight:800; letter-spacing:.02em; color:var(--ink,#20222B);}
  .lpm-bag{flex:none; width:30px; height:30px; border-radius:50%; background:#F1F2F5;
    display:flex; align-items:center; justify-content:center; color:var(--ink,#20222B);}

  .lpm-hero{position:relative; margin-top:14px; height:216px; border-radius:18px; overflow:hidden;
    background:linear-gradient(135deg, rgba(var(--brand-rgb,76,67,214),.5), rgba(var(--accent-rgb,15,165,127),.26));}
  .lpm-heroimg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .lpm-instock{position:absolute; left:13px; top:13px; z-index:2; background:#FFFFFF;
    color:var(--ink,#20222B); font-size:12px; font-weight:800; letter-spacing:.02em;
    border-radius:999px; padding:6px 13px; box-shadow:0 4px 14px rgba(0,0,0,.12);}

  .lpm-meta{margin-top:16px;}
  .lpm-eyebrow{font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:var(--grey,#6B6F7B);}
  .lpm-metarow{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    margin-top:5px;}
  .lpm-pname{font-size:21px; font-weight:800; letter-spacing:-.01em; color:var(--ink,#20222B);}
  .lpm-price{flex:none; font-size:22px; font-weight:800; letter-spacing:-.01em;
    color:var(--ink,#20222B); font-variant-numeric:tabular-nums;}

  .lpm-options{display:flex; gap:9px; margin-top:15px;}
  .lpm-chip{min-width:46px; text-align:center; font-size:14px; font-weight:700;
    color:var(--ink,#20222B); background:#FFFFFF; border:1.5px solid var(--line,#E3E4EA);
    border-radius:10px; padding:9px 12px;}
  .lpm-chip.active{background:var(--brand,#4C43D6); border-color:var(--brand,#4C43D6); color:#fff;}

  .lpm-callout{display:flex; align-items:center; gap:13px; margin-top:16px; border-radius:16px;
    padding:14px 16px; background:var(--accent-lt,#E4F5EF);
    border:1px solid rgba(var(--accent-rgb,15,165,127),.4);}
  .lpm-calicon{flex:none; width:40px; height:40px; border-radius:11px; background:#FFFFFF;
    display:flex; align-items:center; justify-content:center; color:var(--accent,#0FA57F);}
  .lpm-calname{font-size:15.5px; font-weight:800; color:var(--ink,#20222B);}
  .lpm-calsub{font-size:12.5px; color:var(--grey,#6B6F7B); margin-top:2px; line-height:1.35;}

  /* AJO follow-up: a value offered once the action is done (opt-in, not a sale) */
  .lpm-followup{display:flex; align-items:center; gap:12px; margin-top:14px; border-radius:14px;
    padding:13px 15px; background:#F4F5F8; border:1px solid var(--line,#E3E4EA);
    opacity:0; transform:translateY(12px);
    transition:opacity var(--d-confirm,260ms) ease, transform var(--d-confirm,260ms) ease,
      background .2s ease, border-color .2s ease;}
  .lpm.is-done .lpm-followup{opacity:1; transform:none;
    transition-delay:calc(var(--d-press,90ms) + var(--d-check,350ms) + 150ms);}
  .lpm-fuicon{flex:none; width:36px; height:36px; border-radius:10px; background:#FFFFFF;
    display:flex; align-items:center; justify-content:center; color:var(--brand,#4C43D6);}
  /* mini calendar that the reminder animates onto once set */
  .lpm-fucal{position:relative; flex:none; width:38px; height:40px; border-radius:9px;
    background:#FFFFFF; border:1.5px solid var(--line,#E3E4EA); display:none;}
  .lpm-fucal-top{position:absolute; left:0; right:0; top:0; height:9px; border-radius:7px 7px 0 0;
    background:var(--accent,#0FA57F);}
  .lpm-fucal-day{position:absolute; left:0; right:0; top:12px; text-align:center; font-size:15px;
    font-weight:800; line-height:1; color:var(--ink,#20222B);}
  .lpm-fucal-event{position:absolute; left:5px; right:5px; bottom:5px; height:6px; border-radius:2px;
    background:var(--accent,#0FA57F); opacity:0;}
  .lpm-fucal-tick{position:absolute; right:-5px; top:-5px; width:17px; height:17px; border-radius:50%;
    background:var(--accent,#0FA57F); color:#FFFFFF; display:flex; align-items:center;
    justify-content:center; transform:scale(0);}
  .lpm-futext{flex:1; min-width:0;}
  .lpm-fuprompt{font-size:14px; font-weight:800; color:var(--ink,#20222B);}
  .lpm-fusub{font-size:12px; color:var(--grey,#6B6F7B); margin-top:1px;}
  .lpm-fuconfirm{display:none; align-items:center; font-size:14px; font-weight:800;
    color:var(--accent,#0FA57F);}
  .lpm-fubtn{flex:none; appearance:none; cursor:pointer; font:inherit; font-size:13.5px;
    font-weight:800; color:var(--brand,#4C43D6); background:#FFFFFF;
    border:1.5px solid var(--brand,#4C43D6); border-radius:999px; padding:9px 16px;
    transition:transform .12s ease;}
  .lpm-fubtn:active{transform:scale(.97);}
  .lpm-followup.reminded{background:var(--accent-lt,#E4F5EF); border-color:var(--accent,#0FA57F);}
  .lpm-followup.reminded .lpm-fuicon{display:none;}
  .lpm-followup.reminded .lpm-fucal{display:block; animation:lpmCalIn 340ms cubic-bezier(.2,.9,.3,1.25) both;}
  .lpm-followup.reminded .lpm-fucal-event{animation:lpmCalEvt 240ms ease 200ms both;}
  .lpm-followup.reminded .lpm-fucal-tick{animation:lpmCalTick 260ms cubic-bezier(.2,.9,.3,1.5) 380ms both;}
  .lpm-followup.reminded .lpm-fuprompt,
  .lpm-followup.reminded .lpm-fusub,
  .lpm-followup.reminded .lpm-fubtn{display:none;}
  .lpm-followup.reminded .lpm-fuconfirm{display:flex;}
  @keyframes lpmCalIn{0%{transform:scale(.7); opacity:0;} 60%{transform:scale(1.06); opacity:1;} 100%{transform:scale(1);}}
  @keyframes lpmCalEvt{0%{opacity:0; transform:translateY(-9px);} 100%{opacity:1; transform:translateY(0);}}
  @keyframes lpmCalTick{0%{transform:scale(0);} 100%{transform:scale(1);}}

  /* bottom tab bar + home indicator: the app chrome that makes it read as a real app */
  .lpm-tabbar{position:absolute; left:0; right:0; bottom:24px; z-index:5; height:58px;
    display:flex; align-items:center; justify-content:space-around; padding:0 8px;
    background:#FFFFFF; border-top:1px solid var(--line,#E3E4EA);}
  .lpm-tab{position:relative; width:44px; height:44px; display:flex; align-items:center;
    justify-content:center; color:#B4B7BE;}
  .lpm-tab.active{color:var(--ink,#20222B);}
  .lpm-tabbadge{position:absolute; top:2px; right:5px; min-width:16px; height:16px; padding:0 4px;
    border-radius:999px; background:var(--brand,#4C43D6); color:#FFFFFF; font-size:10px;
    font-weight:800; display:none; align-items:center; justify-content:center; line-height:1;}
  .lpm.is-done .lpm-tab.tab-bag .lpm-tabbadge{display:flex;}
  .lpm-homebar{position:absolute; left:50%; bottom:9px; z-index:5; width:134px; height:5px;
    margin-left:-67px; border-radius:3px; background:#1A1D24; opacity:.85;}

  /* the sections cascade in when the app opens */
  .lpm-appbar,.lpm-hero,.lpm-meta,.lpm-options,.lpm-callout,.lpm-act{opacity:0;
    transform:translateY(16px);
    transition:opacity var(--d-sec,240ms) ease, transform var(--d-sec,240ms) ease;}
  .lpm.is-open .lpm-appbar{opacity:1; transform:none; transition-delay:calc(var(--d-exit,220ms)*.4);}
  .lpm.is-open .lpm-hero{opacity:1; transform:none; transition-delay:calc(var(--d-exit,220ms)*.4 + 1*var(--d-row,55ms));}
  .lpm.is-open .lpm-meta{opacity:1; transform:none; transition-delay:calc(var(--d-exit,220ms)*.4 + 2*var(--d-row,55ms));}
  .lpm.is-open .lpm-options{opacity:1; transform:none; transition-delay:calc(var(--d-exit,220ms)*.4 + 3*var(--d-row,55ms));}
  .lpm.is-open .lpm-callout{opacity:1; transform:none; transition-delay:calc(var(--d-exit,220ms)*.4 + 4*var(--d-row,55ms));}
  .lpm.is-open .lpm-act{opacity:1; transform:none; transition-delay:calc(var(--d-exit,220ms)*.4 + 5*var(--d-row,55ms));}

  .lpm-act{display:block; width:100%; margin-top:18px; appearance:none; border:0;
    cursor:pointer; font:inherit; font-size:17px; font-weight:800; color:#fff;
    background:var(--brand,#4C43D6); border-radius:14px; padding:16px;}
  .lpm-act.pressing{transform:scale(.97) !important; transition:transform var(--d-press,90ms) ease;}
  .lpm.is-done .lpm-act{opacity:0; pointer-events:none; transform:translateY(-6px);
    transition-delay:0ms;}

  /* done: drawn check, one radial pulse, receipt slides up */
  .lpm-confirm{position:relative; margin-top:-52px; display:flex; align-items:center; gap:12px;
    background:var(--accent-lt,#E4F5EF); border:1.5px solid var(--accent,#0FA57F);
    border-radius:14px; padding:14px 16px; opacity:0; transform:translateY(10px);
    transition:opacity var(--d-confirm,260ms) ease, transform var(--d-confirm,260ms) ease;}
  .lpm.is-done .lpm-confirm{opacity:1; transform:none; transition-delay:calc(var(--d-press,90ms) + 40ms);}
  .lpm-cring{position:absolute; left:28px; top:50%; width:44px; height:44px;
    margin:-22px 0 0 -8px; border-radius:50%; border:3px solid var(--accent,#0FA57F);
    opacity:0; transform:scale(.4); pointer-events:none;}
  .lpm.is-done .lpm-cring{animation:lpmCPulse 500ms ease-out 1;
    animation-delay:calc(var(--d-press,90ms) + var(--d-check,350ms));}
  @keyframes lpmCPulse{0%{opacity:.7; transform:scale(.4);}100%{opacity:0; transform:scale(1.9);}}
  .lpm-ccheck{flex:none; width:30px; height:30px; border-radius:50%;
    background:var(--accent,#0FA57F); color:#fff; display:flex; align-items:center;
    justify-content:center;}
  .lpm-ccheck path{stroke-dasharray:100; stroke-dashoffset:100;
    transition:stroke-dashoffset var(--d-check,350ms) ease calc(var(--d-press,90ms) + 120ms);}
  .lpm.is-done .lpm-ccheck path{stroke-dashoffset:0;}
  .lpm-ctext{font-size:16.5px; font-weight:800; color:var(--ink,#20222B);}
  .lpm-receipt{display:flex; align-items:center; gap:9px; margin-top:12px; font-size:13.5px;
    font-weight:600; color:var(--grey,#6B6F7B); opacity:0; transform:translateY(12px);
    transition:opacity 240ms ease, transform 240ms ease;}
  .lpm.is-done .lpm-receipt{opacity:1; transform:none;
    transition-delay:calc(var(--d-press,90ms) + var(--d-check,350ms) + 80ms);}
  .lpm-rdot{flex:none; width:6px; height:6px; border-radius:50%; background:var(--accent,#0FA57F);}
</style>

    <div class="lpm-lock">

          <span class="lpm-brand" id="lpmBrand"></span>
          <span class="lpm-bag"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>

        <div class="lpm-options" id="lpmOptions"></div>

          <span class="lpm-calicon" id="lpmCalIcon"></span>
          <div>
            <div class="lpm-calname" id="lpmCalName"></div>
            <div class="lpm-calsub" id="lpmCalSub"></div>
          </div>
        </div>
        <button class="lpm-act" id="lpmAct"></button>
        <div class="lpm-confirm">
          <span class="lpm-cring"></span>
          <span class="lpm-ccheck"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7" pathLength="100"/></svg></span>
          <span class="lpm-ctext" id="lpmConfirm"></span>
        </div>
        <div class="lpm-receipt"><span class="lpm-rdot"></span><span id="lpmReceipt"></span></div>
        <div class="lpm-followup" id="lpmFollow">
          <span class="lpm-fuicon" id="lpmFuIcon"></span>
          <span class="lpm-fucal" id="lpmFuCal" aria-hidden="true">
            <span class="lpm-fucal-top"></span>
            <span class="lpm-fucal-day" id="lpmFuCalDay"></span>
            <span class="lpm-fucal-event"></span>
            <span class="lpm-fucal-tick"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>
          </span>
          <div class="lpm-futext">
            <div class="lpm-fuprompt" id="lpmFuPrompt"></div>
            <div class="lpm-fusub" id="lpmFuSub"></div>
            <div class="lpm-fuconfirm"><span id="lpmFuConfirm"></span></div>
          </div>
          <button class="lpm-fubtn" id="lpmFuBtn"></button>
        </div>
      </div>
      <div class="lpm-tabbar">
        <span class="lpm-tab active"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span>
        <span class="lpm-tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span>
        <span class="lpm-tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21C7 16.5 3 13 3 8.8 3 6 5 4 7.5 4c1.8 0 3.4 1 4.5 2.6C13.1 5 14.7 4 16.5 4 19 4 21 6 21 8.8c0 4.2-4 7.7-9 12.2z"/></svg></span>
        <span class="lpm-tab tab-bag"><span class="lpm-tabbadge">1</span><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>
        <span class="lpm-tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.6 4.6-5 8-5s6.5 1.4 8 5"/></svg></span>
      </div>

    <div class="lpm-ring" id="lpmRing"></div>
    <div class="lpm-notif" id="lpmNotif">
      <div class="lpm-nicon" id="lpmInitials"></div>
      <div>
        <div class="lpm-napp" id="lpmNotifApp"></div>
        <div class="lpm-nhead" id="lpmHead"></div>
        <div class="lpm-nprev" id="lpmPrev"></div>
      </div>
      <div class="lpm-nwhen" id="lpmWhen"></div>
    </div>
  </div>
</div>

<script>
(function(){
  /* ============ DATA: every word, time and duration lives here ============
     Two banked sample shapes so the builder starts from the right one:
       home-restock    - physical retail, in-store hold (pin callout, spec chips)
       fashion-restock - online apparel, back-in-your-size (size chips, delivery callout)
     Both are FICTIONAL and brand-neutral on purpose (a customer's data never travels into
     the library). A deck picks with window.LPM_PRESET, or replaces the whole object with
     window.LPM_DATA (the asos-living-phone demo does the latter with real ASOS copy). */
  var DUR = { wakeMs: 180, dropMs: 420, nudgeMs: 90, ringMs: 600, exitMs: 220,
    appMs: 260, secMs: 240, rowStaggerMs: 55, pressMs: 90, checkMs: 350, confirmMs: 260,
    backMs: 180, playStepMs: 1500 };
  var LPM_PRESETS = {
    "home-restock": {
      statusClock: "7:42",
      lock: { clock: "7:42", date: "Friday 18 July" },
      notification: { initials: "AH", app: "AURORA HOME",
        headline: "Maya, your console is back",
        preview: "One held at Rosedale until Friday, 6pm", when: "now" },
      app: {
        name: "Aurora Home", inStock: "Back in stock", eyebrow: "",
        product: "Oak console", price: "$640",
        options: ["120 cm", "Solid oak"],
        callout: { icon: "pin", name: "Held at Rosedale",
          sub: "Two blocks from her office, open until 9pm" },
        action: "Reserve for pickup", confirmation: "Reserved for Maya",
        receipt: "Pickup Saturday 10am, Rosedale counter 3",
        followUp: { icon: "bell", prompt: "Pickup opens Saturday 10am",
          sub: "Get a reminder so you do not miss it",
          cta: "Remind me", confirm: "Reminder set for Saturday 9am", day: "19" }
      },
      durations: DUR
    },
    "fashion-restock": {
      statusClock: "7:42",
      lock: { clock: "7:42", date: "Thursday 20 March" },
      notification: { initials: "N", app: "NIMBUS",
        headline: "Back in your size",
        preview: "The crew tee you saved is in stock in M", when: "now" },
      app: {
        name: "Nimbus", inStock: "Back in stock", eyebrow: "Nimbus essentials",
        product: "Everyday crew tee", price: "$28",
        options: ["S", { label: "M", active: true }, "L", "XL"],
        callout: { icon: "truck", name: "Free next-day delivery",
          sub: "Order within 4 hours for delivery tomorrow" },
        action: "Add to bag", confirmation: "Added to your bag",
        receipt: "In your bag, size M, free next-day delivery",
        followUp: { icon: "bell", prompt: "Free next-day ends in 4 hours",
          sub: "We can remind you before the cutoff",
          cta: "Remind me", confirm: "Reminder set for 10:45am", day: "20" }
      },
      durations: DUR
    }
  };
  var LPM_DATA = window.LPM_DATA || LPM_PRESETS[window.LPM_PRESET] || LPM_PRESETS["home-restock"];
  /* ======================================================================== */

  var D = LPM_DATA, T = D.durations, A = D.app;

  /* standardised lock-screen wallpaper: set LPM_DATA.wallpaper to a fixed image for a
     consistent lock across every phone in a deck; else the brand-token gradient shows. */
  if (D.wallpaper){
    var _w = document.querySelector(".lpm-wall");
    _w.classList.add("lpm-wall-img");
    _w.style.backgroundImage = "url('" + String(D.wallpaper).replace(/'/g, "%27") + "')";
  }
  function $(id){ return document.getElementById(id); }
  var root = $("lpm"), ringEl = $("lpmRing"), actBtn = $("lpmAct");
  [["--d-wake", T.wakeMs], ["--d-drop", T.dropMs], ["--d-nudge", T.nudgeMs],
   ["--d-ring", T.ringMs], ["--d-exit", T.exitMs], ["--d-app", T.appMs],
   ["--d-sec", T.secMs], ["--d-row", T.rowStaggerMs], ["--d-press", T.pressMs],
   ["--d-check", T.checkMs], ["--d-confirm", T.confirmMs], ["--d-back", T.backMs]
  ].forEach(function(v){ root.style.setProperty(v[0], v[1] + "ms"); });

  var CAL_ICONS = {
    pin: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',
    truck: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v9H3z"/><path d="M14 9h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17.5" cy="18" r="1.8"/></svg>',
    clock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
    tag: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8.5" cy="8.5" r="1.4"/></svg>',
    bell: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0v4l2 3H4l2-3z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>'
  };
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  $("lpmStatusClock").textContent = D.statusClock;
  $("lpmClock").textContent = D.lock.clock;
  $("lpmDate").textContent = D.lock.date;

  /* notification: the app's square mark (a short wordmark or initials, brand-coloured tile) */
  $("lpmInitials").textContent = D.notification.initials;
  $("lpmNotifApp").textContent = D.notification.app;
  $("lpmHead").textContent = D.notification.headline;
  $("lpmPrev").textContent = D.notification.preview;
  $("lpmWhen").textContent = D.notification.when;

  /* app bar brand: logo image or plain name */
  $("lpmBrand").innerHTML = A.logo
    ? '<img class="lpm-logo" src="' + esc(A.logo) + '" alt="' + esc(A.name || "") + '">'
    : '<span class="lpm-appname">' + esc(A.name || "") + '</span>';

  /* hero: product photo if provided, else the token gradient placeholder */
  if (A.heroImage){
    var img = document.createElement("img");
    img.className = "lpm-heroimg"; img.src = A.heroImage; img.alt = A.product || "";
    $("lpmHero").insertBefore(img, $("lpmHero").firstChild);
  }
  if (A.inStock){ $("lpmInStock").textContent = A.inStock; }
  else { $("lpmInStock").style.display = "none"; }

  if (A.eyebrow){ $("lpmEyebrow").textContent = A.eyebrow; }
  else { $("lpmEyebrow").style.display = "none"; }
  $("lpmProduct").textContent = A.product;
  $("lpmPrice").textContent = A.price;

  /* options / size chips: strings, or {label, active} for the selected one */
  var opts = A.options || [];
  if (opts.length){
    $("lpmOptions").innerHTML = opts.map(function(o){
      var label = (o && typeof o === "object") ? o.label : o;
      var active = (o && typeof o === "object") ? o.active : false;
      return '<span class="lpm-chip' + (active ? ' active' : '') + '">' + esc(label) + '</span>';
    }).join("");
  } else { $("lpmOptions").style.display = "none"; }

  $("lpmCalIcon").innerHTML = CAL_ICONS[(A.callout && A.callout.icon) || "pin"] || CAL_ICONS.pin;
  $("lpmCalName").textContent = A.callout ? A.callout.name : "";
  $("lpmCalSub").textContent = A.callout ? A.callout.sub : "";
  actBtn.textContent = A.action;
  $("lpmConfirm").textContent = A.confirmation;
  $("lpmReceipt").textContent = A.receipt;

  /* AJO follow-up (optional): an opt-in value offered after the action, e.g. a timed
     reminder before a delivery cutoff. Tapping it confirms in place; it never advances the
     phone (the root tap surface is inert once done). */
  var followEl = document.getElementById("lpmFollow");
  if (A.followUp){
    $("lpmFuIcon").innerHTML = CAL_ICONS[A.followUp.icon || "bell"] || CAL_ICONS.bell;
    $("lpmFuPrompt").textContent = A.followUp.prompt;
    if (A.followUp.sub){ $("lpmFuSub").textContent = A.followUp.sub; }
    else { $("lpmFuSub").style.display = "none"; }
    if (A.followUp.day){ $("lpmFuCalDay").textContent = A.followUp.day; }
    else { $("lpmFuCalDay").style.display = "none"; }
    $("lpmFuBtn").textContent = A.followUp.cta;
    $("lpmFuConfirm").textContent = A.followUp.confirm;
    $("lpmFuBtn").addEventListener("click", function(e){
      e.stopPropagation();
      followEl.classList.add("reminded");
    });
  } else { followEl.style.display = "none"; }

  /* state machine: 0 locked, 1 notified, 2 open, 3 done; classes are cumulative so
     CSS transitions carry any interrupted state to the new one without snapping.
     TWO timer pools on purpose: fx (nudge/ring/press cleanup) and the play() chain.
     A manual call clears both (interruptible); a chain step must never clear the
     chain that scheduled it, or play() kills its own open/act. */
  var state = 0, fx = [], chain = [];
  function later(fn, ms){ fx.push(setTimeout(fn, ms)); }
  function clearFx(){ fx.forEach(clearTimeout); fx = []; }
  function clearChain(){ chain.forEach(clearTimeout); chain = []; }
  function apply(){
    root.classList.toggle("is-notified", state >= 1);
    root.classList.toggle("is-open", state >= 2);
    root.classList.toggle("is-done", state >= 3);
  }
  function doPush(){
    if (state !== 0){ return; }
    state = 1; apply();
    root.classList.add("nudge");
    later(function(){ root.classList.remove("nudge"); }, T.nudgeMs + 20);
    later(function(){
      ringEl.classList.add("pulse");
      later(function(){ ringEl.classList.remove("pulse"); }, T.ringMs + 40);
    }, T.dropMs - 60);
  }
  function doOpen(){
    if (state >= 2){ return; }
    ringEl.classList.remove("pulse");
    state = 2; apply();
  }
  function doAct(){
    if (state !== 2){ return; }
    actBtn.classList.add("pressing");
    later(function(){ actBtn.classList.remove("pressing"); }, T.pressMs);
    state = 3; apply();
  }
  function doReset(){
    state = 0;
    root.classList.add("fast");
    root.classList.remove("nudge");
    ringEl.classList.remove("pulse");
    actBtn.classList.remove("pressing");
    followEl.classList.remove("reminded");
    apply();
    later(function(){ root.classList.remove("fast"); }, T.backMs + 30);
  }
  function push(){ clearChain(); clearFx(); doPush(); }
  function open(){ clearChain(); clearFx(); doOpen(); }
  function act(){ clearChain(); clearFx(); doAct(); }
  function reset(){ clearChain(); clearFx(); doReset(); }
  function play(){
    clearChain(); clearFx(); doReset();
    chain.push(setTimeout(doPush, T.backMs + 60));
    chain.push(setTimeout(doOpen, T.backMs + 60 + T.playStepMs));
    chain.push(setTimeout(doAct, T.backMs + 60 + T.playStepMs * 2));
  }

  /* the phone is the tap surface: one deliberate gesture per advance */
  root.addEventListener("click", function(){
    if (state === 0){ push(); }
    else if (state === 1){ open(); }
    else if (state === 2){ act(); }
  });

  window.LPM = { push: push, open: open, act: act, play: play, reset: reset };
})();
</script>
<!-- TESTS (mounted in a host page with customer tokens set on :root):
1. Initial locked: #lpmNotif computed transform has translateY about -480 (off-screen),
   .lpm-app opacity 0, .lpm-dim opacity above .25, no is-* class on #lpm.
2. Pressing ArrowRight or ArrowLeft with nothing focused changes NOTHING (no global keys).
3. LPM.push(): #lpm gains then loses "nudge" (frame back to no transform within 300ms);
   #lpmNotif settles at translateY(0) within 600ms with the bloomed shadow; .lpm-dim fades
   to 0; #lpmRing gains "pulse" once and loses it after ~600ms.
4. LPM.open() called mid-push (about 100ms in): no half state; within 600ms the lock layer's
   opacity is exactly 0, the app sheet is at opacity 1, the notification has LEFT
   (translateY about -360 and opacity 0), and the app sections (.lpm-appbar, .lpm-hero,
   .lpm-meta, .lpm-options, .lpm-callout, .lpm-act) reach opacity 1.
5. LPM.act(): the check path's stroke-dashoffset computes to 0 within ~700ms; .lpm-receipt
   reaches opacity 1; the action button fades and stops accepting pointer events.
6. LPM.play() from locked reaches done with no user input.
7. LPM.reset() from done: re-locked within ~400ms (dim restored above .25, notif off-screen,
   no is-* classes), ready to run again.
8. Tap surface: with a pointer only, click screen (locked -> notified), click again
   (-> open), click the action (-> done); a fourth click changes nothing.
9. Token uptake: with host tokens set, the notification icon square (no logo) and the action
   button compute to the host --brand; the wallpaper gradient resolves from --brand-rgb.
10. Data override: with window.LPM_DATA set before load, app.logo renders an <img> in the app
    bar, app.heroImage renders a .lpm-heroimg, and an option with active:true carries .active.
11. Presets: default (no override) renders #lpmProduct "Oak console" with a pin callout; with
    window.LPM_PRESET="fashion-restock" set before load, #lpmProduct is "Everyday crew tee",
    one size chip carries .active, and the callout reads "Free next-day delivery".
12. App chrome: when open, the .lpm-tabbar (5 .lpm-tab, one .active) and .lpm-homebar are
    visible; once done, .lpm-tab.tab-bag .lpm-tabbadge is displayed (the bag count).
13. Follow-up: in the done state .lpm-followup reaches opacity 1; clicking #lpmFuBtn adds
    .reminded (prompt and button hide, .lpm-fuconfirm shows) and does NOT advance past done;
    LPM.reset() clears .reminded.
14. Zero em dashes anywhere in rendered text.
-->
