<!-- Alias of adobe-icon.svg, kept under the legacy filename so every existing
     {{adobe_symbol_path}} → symbol-*.svg reference keeps resolving without template edits.
     The modern Adobe mark is a single self-contained app-icon tile (red rounded square +
     white glyph) — it is not recoloured per background, so symbol-red/white/black are now
     identical. Do NOT replace this with the old bare/untiled "A" glyph. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Adobe">
  <rect x="16" y="16" width="480" height="480" rx="116" fill="#EB1000"/>
  <path transform="translate(131 141) scale(1.497)" fill="#fff"
    d="M97.69 150.12L85.72 116.83H55.7L80.94 53.3L119.23 150.12H164.7L104 4.35H61.14L0 150.12H97.69Z"/>
</svg>
