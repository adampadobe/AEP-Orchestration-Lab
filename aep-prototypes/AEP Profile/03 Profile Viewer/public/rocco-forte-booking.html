<head>

  <script>(function(){try{var d=document.documentElement;if(localStorage.getItem('aepTheme')==='dark')d.setAttribute('data-aep-theme','dark');else d.removeAttribute('data-aep-theme');if(localStorage.getItem('aepSidebarCollapsed')==='1')d.setAttribute('data-sidebar-collapsed','');else d.removeAttribute('data-sidebar-collapsed');var mp=localStorage.getItem('aepMenuPalette');if(mp&&mp!=='default')d.setAttribute('data-aep-menu-palette',mp);else d.removeAttribute('data-aep-menu-palette');var bp=localStorage.getItem('aepBgPreset');if(bp&&bp!=='default')d.setAttribute('data-aep-bg-preset',bp);else d.removeAttribute('data-aep-bg-preset');var st=localStorage.getItem('aepHomeDashboardSidebarTheme');if(st==='light')d.setAttribute('data-ajo-sidebar','light');else d.setAttribute('data-ajo-sidebar','dark');}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      statusMessageId: 'roccoForteMessage',

      bottomDockDisclaimer:

<body class="mod-demo-page rocco-forte-demo-page home-dashboard-concierge">
  <div class="mod-demo-top-anchor" id="roccoForteDemoTopAnchor">
    <div class="mod-demo-id-banner" role="region" aria-label="Customer identity">
      <div class="mod-demo-id-inner aep-demo-id-inner"
        data-demo-env-strip-mount="site-clone-shell"
        data-demo-env-strip-variant="spectrum"
        data-demo-env-strip-title="Rocco Forte Hotels (booking)"
        data-demo-env-strip-subtitle="Active Configuration"
        data-demo-env-strip-prefix="roccoForte"
        data-demo-env-strip-selected-script-id="roccoForteSelectedScript"
        data-demo-env-strip-script-preview-class="mod-demo-script-preview"
        data-demo-env-strip-message-id="roccoForteMessage"
        data-demo-env-strip-profile-btn-label="Look up profile"
        data-demo-env-strip-bc-bottom="1"
        data-demo-env-strip-disclaimer="Locally implemented Rocco Forte booking date selection. Not affiliated with Rocco Forte Hotels."></div>
    </div>
  </div>

  <div id="siteCloneBcFrameHost" class="site-clone-bc-frame-host" hidden>
    <div id="siteCloneBcFrameMount" class="site-clone-bc-frame-mount"></div>
  </div>

  <main class="rocco-forte-site" id="roccoForteSite" aria-label="Rocco Forte Hotels booking">
    <div class="rf-booking-page">
      <div class="rf-booking-shell">
        <div class="rf-booking-topbar">
          <div class="rf-booking-topbar__utilities rf-booking-topbar__utilities--spacer" aria-hidden="true">
            <span>English</span>
          </div>
          <a href="rocco-forte-demo.html" class="rf-booking-topbar__logo" aria-label="Rocco Forte Hotels home">
            <img src="rocco-forte-demo-assets/logo.png" width="120" height="42" alt="Rocco Forte Hotels">
          </a>
          <div class="rf-booking-topbar__utilities">
            <span>English</span>
            <span>Currency</span>
          </div>
        </div>

        <div class="rf-booking-range-bar is-empty" id="rfBookingRangeBar">Select dates</div>

        <div class="rf-booking-main">
          <section class="rf-booking-calendar-panel" aria-label="Select your dates">
            <p class="rf-booking-calendar-title">Select your dates</p>
            <div class="rf-booking-calendars">
              <div class="rf-booking-calendars__nav">
                <button type="button" id="rfCalendarPrev" aria-label="Previous months">&#8592;</button>
                <button type="button" id="rfCalendarNext" aria-label="Next months">&#8594;</button>
              </div>
              <div class="rf-booking-months">
                <div class="rf-booking-month" id="rfCalendarMonthLeft">
                  <h2 class="rf-booking-month__title" id="rfCalendarTitleLeft"></h2>
                  <div class="rf-booking-weekdays" aria-hidden="true">
                    <span class="rf-booking-weekday">Sun</span>
                    <span class="rf-booking-weekday">Mon</span>
                    <span class="rf-booking-weekday">Tue</span>
                    <span class="rf-booking-weekday">Wed</span>
                    <span class="rf-booking-weekday">Thu</span>
                    <span class="rf-booking-weekday">Fri</span>
                    <span class="rf-booking-weekday">Sat</span>
                  </div>
                  <div class="rf-booking-days" id="rfCalendarDaysLeft" role="grid"></div>
                </div>
                <div class="rf-booking-month" id="rfCalendarMonthRight">
                  <h2 class="rf-booking-month__title" id="rfCalendarTitleRight"></h2>
                  <div class="rf-booking-weekdays" aria-hidden="true">
                    <span class="rf-booking-weekday">Sun</span>
                    <span class="rf-booking-weekday">Mon</span>
                    <span class="rf-booking-weekday">Tue</span>
                    <span class="rf-booking-weekday">Wed</span>
                    <span class="rf-booking-weekday">Thu</span>
                    <span class="rf-booking-weekday">Fri</span>
                    <span class="rf-booking-weekday">Sat</span>
                  </div>
                  <div class="rf-booking-days" id="rfCalendarDaysRight" role="grid"></div>
                </div>
              </div>
            </div>
          </section>

          <aside class="rf-booking-summary" aria-label="Booking summary">
            <div class="rf-booking-dates-row">
              <div class="rf-booking-date-col">
                <div class="rf-booking-date-col__label">Arrival</div>
                <div class="rf-booking-date-col__value">
                  <span class="rf-booking-date-col__day" id="rfArrivalDay"></span>
                  <span class="rf-booking-date-col__month" id="rfArrivalMonth"></span>
                </div>
              </div>
              <div class="rf-booking-date-col">
                <div class="rf-booking-date-col__label">Departure</div>
                <div class="rf-booking-date-col__value">
                  <span class="rf-booking-date-col__day" id="rfDepartureDay"></span>
                  <span class="rf-booking-date-col__month" id="rfDepartureMonth"></span>
                </div>
              </div>
            </div>

            <div class="rf-booking-field">
              <div class="rf-booking-dropdown">
                <button type="button" class="rf-booking-dropdown__trigger" id="rfAdultsTrigger" aria-haspopup="listbox" aria-expanded="false">
                  <span class="rf-booking-dropdown__label">2 Adults</span>
                  <span class="rf-booking-dropdown__caret" aria-hidden="true"></span>
                </button>
                <ul class="rf-booking-dropdown__menu" id="rfAdultsMenu" role="listbox" hidden></ul>
              </div>
            </div>

            <div class="rf-booking-field">
              <div class="rf-booking-dropdown">
                <button type="button" class="rf-booking-dropdown__trigger" id="rfChildrenTrigger" aria-haspopup="listbox" aria-expanded="false">
                  <span class="rf-booking-dropdown__label">0 Children</span>
                  <span class="rf-booking-dropdown__caret" aria-hidden="true"></span>
                </button>
                <ul class="rf-booking-dropdown__menu" id="rfChildrenMenu" role="listbox" hidden></ul>
              </div>
            </div>

            <div class="rf-booking-codes">
              <input type="text" id="rfPromoCode" placeholder="Promo code" aria-label="Promo code" autocomplete="off">
              <input type="text" id="rfGroupCode" placeholder="Group code" aria-label="Group code" autocomplete="off">
            </div>

            <button type="button" class="rf-booking-check-btn" id="rfCheckAvailability" disabled>
              Check availability
            </button>
          </aside>
        </div>
      </div>

      <div class="rf-booking-footer-actions">
        <button type="button" class="rf-booking-multi-hotel">Build a trip with multiple hotels</button>
      </div>
      <button type="button" class="rf-booking-modify">modify reservation</button>
    </div>
  </main>

  <button
    type="button"
    id="siteCloneBcFab"
    class="aep-bc-reopen-btn site-clone-bc-fab"
    hidden
    aria-label="Open Brand Concierge"
    aria-expanded="false"
    aria-controls="aepBcModal"
  >
    <img
      src="https://contenthosting.web.app/logos/adobe_icon_146235.webp"
      alt=""
      width="48"
      height="48"
      decoding="async"
    />
  </button>

  <div
    id="aepBcModal"
    class="aep-bc-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="aepBcModalTitle"
    hidden
  >
    <button type="button" class="aep-bc-modal__backdrop" data-aep-bc-close aria-label="Close dialog"></button>
    <div class="aep-bc-modal__dialog">
      <button type="button" class="aep-bc-modal__close" data-aep-bc-close aria-label="Close Brand Concierge">
        &times;
      </button>
      <h2 id="aepBcModalTitle" class="visually-hidden">Brand Concierge</h2>
      <div id="brand-concierge-mount" class="aep-bc-modal__mount"></div>
    </div>
  </div>

  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" aria-label="Primary"></aside>
    <div class="dashboard-main-wrap">
      <main class="dashboard-main app-page mod-demo-empty-main" aria-hidden="true"></main>
    </div>
  </div>

  <div id="profileViewerModalMount" data-aep-profile-viewer-modal-mount="1"></div>

  <script src="firebase-database-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="aep-global-sandbox.js?v=20260625-incognito-env-fix"></script>
  <script src="aep-lab-sandbox-sync.js?v=20260514-id-token-health"></script>
  <script src="email-cache.js"></script>
  <script src="identity-picker.js"></script>
  <script src="email-engagement-metrics.js"></script>
  <script src="shared/profile-viewer-modal.js?v=20260601-modal-central"></script>
  <script src="aep-profile-drawer.js?v=20260521-ns-autodetect"></script>
  <script src="aep-demo-web-push.js?v=20260512-lab-push"></script>
  <script src="shared/env-bar.js?v=20260625-datastream-paste-row-ensure"></script>
  <script>
    window.envBarConfig = {
      prefix: 'roccoForte',
      variant: 'spectrum',
      features: { webPush: true, bc: true },
    };
    window.roccoForteDemoConfig = {
      viewName: 'Rocco Forte Hotels — Booking',
      onReady: function (ctx) {
        window.roccoForteDemoConfig.setMessage = ctx.setMessage;
      },
    };
  </script>
  <script src="aep-demo-generator-targets.js?v=20260508"></script>
  <script src="brand-concierge-styles-bundle.js?v=20260520-bc-bundle"></script>
  <script src="brand-concierge-toggle.js?v=20260625-bc-aep-events-ecid"></script>
  <script>
    window.SiteCloneDemoEnv = {
      storagePrefix: 'roccoForteDemo',
      webPushBySandboxKey: 'roccoForteDemoWebPushOnInjectBySandbox',
      webPushLegacyKey: 'roccoForteDemoWebPushOnInjectToggle',
      webPushToggleId: 'roccoForteWebPushOnInjectToggle',
      bcOnInjectToggleId: 'roccoForteBcOnInjectToggle',
      bcStyleSelectId: 'roccoForteBcStyleSelect',
    };
  </script>
  <script src="rocco-forte-booking-state.js?v=20260625-rocco-forte-hotels"></script>
  <script src="rocco-forte-demo.js?v=20260625-rocco-forte-login"></script>
  <script src="rocco-forte-booking.js?v=20260625-rocco-forte-v3"></script>
  <script src="site-clone-bc.js?v=20260625-bc-aep-events-ecid"></script>
  <div id="brand-concierge-mount-host" aria-live="polite" hidden>
    <button type="button" id="aepBcDismissBtn" class="aep-bc-dismiss-btn" aria-label="Close Brand Concierge">×</button>
  </div>
  <script src="brand-concierge-controls.js?v=20260520-bc-controls"></script>
  <script defer src="aep-theme.js?v=20260421-fs-helper"></script>
  <script defer src="aep-theme-prefs.js?v=20260416d"></script>
  <script defer src="aep-lab-nav.js?v=20260625-rocco-forte"></script>
</body>
</html>
