<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Starbucks — Order</title>
  <link rel="stylesheet" href="starbucks-mobile-app.css?v=20260622c">
</head>
<body class="sb-mobile-app" data-starbucks-mobile-page="order">
  <div class="sb-mobile-shell">
    <header class="sb-mobile-header">
      <div class="sb-mobile-header-row">
        <img src="../assets/logo.png" alt="" class="sb-mobile-header-logo" width="32" height="32" aria-hidden="true">
        <div>
          <p class="sb-mobile-greeting">Order ahead</p>
          <h1>Your bag</h1>
        </div>
      </div>
    </header>
    <div class="sb-mobile-scroll">
      <section id="TopRibbon" aria-label="Personalized top ribbon" role="region"></section>
      <div class="sb-mobile-hero sb-mobile-hero--image" data-hero-mount data-hero-mount-fit="contain" aria-label="Order promo" style="background-image: url('../assets/hero-order-ahead.webp')">
        <p class="sb-mobile-hero-kicker">Pick up in 5–10 min</p>
        <p class="sb-mobile-hero-stars">Dubai Mall · Store #142</p>
      </div>
      <ul class="sb-mobile-list" id="sbMobileOrderList"></ul>
      <button type="button" class="sb-mobile-checkout" id="sbMobileCheckoutBtn">Place order</button>
      <section id="ContentCardContainer" class="ContentCardContainer" aria-label="Content cards" role="region"></section>
    </div>
    <nav class="sb-mobile-tabbar" id="sbMobileTabBar" aria-label="App navigation"></nav>
  </div>
  <script src="../starbucks-mock-data.js?v=20260622b"></script>
  <script src="starbucks-mobile-app.js?v=20260622c"></script>
</body>
</html>
