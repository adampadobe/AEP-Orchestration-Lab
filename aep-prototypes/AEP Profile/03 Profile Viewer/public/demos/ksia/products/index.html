<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product catalog — King Salman International Airport</title>
  <link rel="stylesheet" href="../ksia-site.css?v=20260615a">
</head>
<body class="ksia-site" data-ksia-page-id="product-catalog" data-ksia-context="product catalog" data-ksia-journey-stage="airport">
  <div id="ksia-chrome-mount"></div>
  <main class="ksia-main" id="ksia-main">
    <section class="ksia-subpage-hero" aria-labelledby="ksia-catalog-heading">
      <h1 class="ksia-page-title" id="ksia-catalog-heading">Product catalog</h1>
      <p class="ksia-subpage-hero-lead">Duty-free, parking, dining, lounges, and AIVC services — stable product pages for Brand Concierge and retail integrations.</p>
    </section>

    <section class="ksia-section ksia-section--white" aria-labelledby="ksia-catalog-filter-heading">
      <div class="ksia-shop-filter-row">
        <h2 class="ksia-section-title" id="ksia-catalog-filter-heading" style="margin:0;flex:1">All products</h2>
        <label class="ksia-shop-filter-label" for="ksiaCatalogCategoryFilter">Category</label>
        <select id="ksiaCatalogCategoryFilter" class="ksia-shop-filter-select" aria-label="Filter by category"></select>
      </div>
      <div class="ksia-product-catalog-grid" id="ksiaCatalogGrid"></div>
    </section>
  </main>
  <script src="../ksia-mock-data.js?v=20260615a"></script>
  <script src="../ksia-events.js?v=20260612"></script>
  <script src="../ksia-chrome.js?v=20260612b"></script>
  <script src="../ksia-journey-chrome.js?v=20260623-env-inline" defer></script>
  <script src="../ksia-product-page.js?v=20260615a"></script>
</body>
</html>
