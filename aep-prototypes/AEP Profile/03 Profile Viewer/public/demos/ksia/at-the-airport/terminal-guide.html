<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal guide — King Salman International Airport</title>
  <link rel="stylesheet" href="../ksia-site.css?v=20260612e">
</head>
<body class="ksia-site" data-ksia-page-id="terminal-guide" data-ksia-nav-section="at-the-airport" data-ksia-context="terminal-guide airline lookup" data-ksia-journey-stage="airport">
  <div id="ksia-chrome-mount"></div>
  <main class="ksia-main" id="ksia-main">

    <header class="ksia-subpage-hero">
      <h1 class="ksia-display-heading">Terminal guide</h1>
      <p class="ksia-subpage-hero-lead">Find which terminal your airline uses — six terminals, one seamless KSIA experience.</p>
    </header>

    <section class="ksia-section ksia-section--white" aria-labelledby="ksia-terminal-guide-heading">
      <div class="ksia-terminal-guide-layout">
        <div>
          <h2 class="ksia-section-title" id="ksia-terminal-guide-heading">Popular airlines</h2>
          <ul class="ksia-terminal-guide-airlines" id="ksiaTerminalGuideList"></ul>
        </div>
        <div>
          <h2 class="ksia-section-title">Airline lookup</h2>
          <form id="ksiaTerminalGuideForm" class="ksia-terminal-guide-form-row">
            <select id="ksiaTerminalGuideSelect" class="ksia-terminal-guide-select" aria-label="Select airline"></select>
            <button type="submit" class="ksia-btn ksia-btn-primary">Find terminal</button>
          </form>
          <div id="ksiaTerminalGuideResult" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section class="ksia-section ksia-section--sand" aria-label="Related links">
      <h2 class="ksia-section-title">Explore terminals</h2>
      <ul class="ksia-link-grid">
        <li><a href="terminal-1.html" class="ksia-card-link">Terminal 1</a></li>
        <li><a href="maps.html" class="ksia-card-link">Airport maps</a></li>
        <li><a href="index.html" class="ksia-card-link">At the airport hub</a></li>
      </ul>
    </section>

  </main>
  <script src="../ksia-mock-data.js?v=20260612e"></script>
  <script src="../ksia-events.js?v=20260612"></script>
  <script src="../ksia-chrome.js?v=20260612b"></script>
  <script src="../ksia-journey-chrome.js?v=20260623-env-inline" defer></script>
  <script src="../ksia-at-airport-pages.js?v=20260612e"></script>
</body>
</html>
