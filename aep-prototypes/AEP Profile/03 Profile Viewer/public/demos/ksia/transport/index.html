<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transport — King Salman International Airport</title>
  <link rel="stylesheet" href="../ksia-site.css?v=20260613a">
</head>
<body class="ksia-site" data-ksia-page-id="transport-hub" data-ksia-context="transport-hub pre-trip" data-ksia-journey-stage="pre-trip">
  <div id="ksia-chrome-mount"></div>
  <main class="ksia-main" id="ksia-main">

    <section class="ksia-transport-hero" aria-label="Getting to and from KSIA">
      <div class="ksia-transport-hero-inner">
        <p class="ksia-transport-hero-kicker" id="ksiaTransportHeroKicker">Getting to &amp; from KSIA</p>
        <p class="ksia-transport-hero-lead" id="ksiaTransportHeroLead"></p>
        <span class="ksia-transport-hero-stage" id="ksiaTransportHeroStage"></span>
      </div>
    </section>

    <section class="ksia-section ksia-section--white" aria-labelledby="ksia-transport-modes-heading">
      <h2 class="ksia-section-title" id="ksia-transport-modes-heading">Choose your mode</h2>
      <ul class="ksia-transport-modes-grid" id="ksiaTransportModes"></ul>
    </section>

    <section class="ksia-section ksia-section--sunlit" aria-labelledby="ksia-transport-journey-heading">
      <p class="ksia-section-kicker">Your journey</p>
      <h2 class="ksia-display-heading" id="ksia-transport-journey-heading">Pre-trip transport timeline</h2>
      <ol class="ksia-flights-stepper" id="ksiaTransportStepper" aria-label="Transport planning steps"></ol>
    </section>

    <section class="ksia-section ksia-section--sand" aria-labelledby="ksia-transport-assistant-heading">
      <p class="ksia-section-kicker">AIVC assistant</p>
      <h2 class="ksia-display-heading" id="ksia-transport-assistant-heading"><span id="ksiaTransportAssistantTitle">Best option for your trip</span></h2>
      <div class="ksia-transport-assistant-card">
        <p class="ksia-board-assistant-lead" id="ksiaTransportAssistantLead"></p>
        <p class="ksia-transport-assistant-rec" id="ksiaTransportAssistantRec"></p>
        <div class="ksia-board-assistant-actions" id="ksiaTransportAssistantActions"></div>
      </div>
    </section>

    <section class="ksia-section ksia-section--white" aria-labelledby="ksia-transport-suggestions-heading">
      <h2 class="ksia-section-title" id="ksia-transport-suggestions-heading">Suggested for your trip</h2>
      <ul class="ksia-flights-assistant-list" id="ksiaTransportSuggestions"></ul>
    </section>

    <section class="ksia-section ksia-section--sand" aria-labelledby="ksia-transport-services-heading">
      <h2 class="ksia-section-title" id="ksia-transport-services-heading">Related services</h2>
      <ul class="ksia-flights-services-grid" id="ksiaTransportServices"></ul>
    </section>

    <section class="ksia-section ksia-section--white" aria-labelledby="ksia-transport-concierge-heading">
      <div class="ksia-aivc-concierge-band">
        <h2 class="ksia-display-heading" id="ksia-transport-concierge-heading" style="color:var(--ksia-warm-gold);margin-bottom:12px"><span id="ksiaTransportConciergeTitle">Concierge-ready</span></h2>
        <p id="ksiaTransportConciergeLead"></p>
        <button type="button" class="ksia-btn ksia-btn-primary" id="ksiaTransportConciergeCta">Open AIVC concierge (mock)</button>
      </div>
    </section>

  </main>
  <script src="../ksia-mock-data.js?v=20260613a"></script>
  <script src="../ksia-events.js?v=20260612"></script>
  <script src="../ksia-chrome.js?v=20260612b"></script>
  <script src="../ksia-journey-chrome.js?v=20260623-env-inline" defer></script>
  <script src="../ksia-transport-pages.js?v=20260613a"></script>
</body>
</html>
