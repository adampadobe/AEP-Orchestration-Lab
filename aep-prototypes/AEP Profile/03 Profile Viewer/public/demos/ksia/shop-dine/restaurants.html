<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurants — King Salman International Airport</title>
  <link rel="stylesheet" href="../ksia-site.css?v=20260612f">
</head>
<body class="ksia-site" data-ksia-page-id="restaurants" data-ksia-context="restaurants airport" data-ksia-journey-stage="airport">
  <div id="ksia-chrome-mount"></div>
  <main class="ksia-main" id="ksia-main">

    <section class="ksia-subpage-hero" aria-labelledby="ksia-restaurants-heading">
      <h1 class="ksia-page-title" id="ksia-restaurants-heading">Restaurants &amp; cafés</h1>
      <p class="ksia-subpage-hero-lead">Filter by terminal and cuisine — wait times and reserve placeholders for your travel day.</p>
    </section>

    <section class="ksia-section ksia-section--white" aria-labelledby="ksia-restaurants-grid-heading">
      <div class="ksia-shop-filter-row">
        <label for="ksiaRestaurantTerminalFilter">Terminal</label>
        <select id="ksiaRestaurantTerminalFilter" aria-label="Filter by terminal"></select>
        <label for="ksiaRestaurantCuisineFilter">Cuisine</label>
        <select id="ksiaRestaurantCuisineFilter" aria-label="Filter by cuisine"></select>
      </div>
      <h2 class="ksia-section-title" id="ksia-restaurants-grid-heading">Restaurant listings</h2>
      <div class="ksia-shop-restaurants-grid" id="ksiaRestaurantsGrid"></div>
    </section>

    <section class="ksia-section ksia-section--sand" aria-labelledby="ksia-restaurants-assistant-heading">
      <p class="ksia-section-kicker">AIVC assistant</p>
      <h2 class="ksia-display-heading" id="ksia-restaurants-assistant-heading"><span id="ksiaRestaurantsAssistantTitle">Dietary preferences</span></h2>
      <div class="ksia-shop-assistant-card">
        <p class="ksia-board-assistant-lead" id="ksiaRestaurantsAssistantLead"></p>
        <a href="../aivc/wallet-setup.html" class="ksia-at-airport-inline-link" id="ksiaRestaurantsWalletLink">Update preferences in wallet &rarr;</a>
      </div>
    </section>

  </main>
  <script src="../ksia-mock-data.js?v=20260612f"></script>
  <script src="../ksia-events.js?v=20260612"></script>
  <script src="../ksia-chrome.js?v=20260612b"></script>
  <script src="../ksia-journey-chrome.js?v=20260623-env-inline" defer></script>
  <script src="../ksia-shop-pages.js?v=20260612f"></script>
</body>
</html>
