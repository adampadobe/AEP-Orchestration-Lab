<body class="mod-demo-page rocco-forte-demo-page home-dashboard-concierge">
  <div class="mod-demo-top-anchor" id="roccoForteDemoTopAnchor">
    <div class="mod-demo-id-banner" role="region" aria-label="Customer identity">
      <div class="mod-demo-id-inner aep-demo-id-inner"
        data-demo-env-strip-mount="site-clone-shell"
        data-demo-env-strip-variant="spectrum"
        data-demo-env-strip-title="Rocco Forte Hotels (select hotel)"
        data-demo-env-strip-subtitle="Active Configuration"
        data-demo-env-strip-prefix="roccoForte"
        data-demo-env-strip-selected-script-id="roccoForteSelectedScript"
        data-demo-env-strip-script-preview-class="mod-demo-script-preview"
        data-demo-env-strip-message-id="roccoForteMessage"
        data-demo-env-strip-profile-btn-label="Look up profile"
        data-demo-env-strip-bc-bottom="1"
        data-demo-env-strip-disclaimer="Step 1 — Select Hotel. Not affiliated with Rocco Forte Hotels."></div>
    </div>
  </div>

  <div id="siteCloneBcFrameHost" class="site-clone-bc-frame-host" hidden>
    <div id="siteCloneBcFrameMount" class="site-clone-bc-frame-mount"></div>
  </div>

  <main class="rocco-forte-site rf-hotels-page" id="roccoForteSite" aria-label="Rocco Forte Hotels — select hotel">
    <div class="rf-hotels-shell">
      <div class="rf-hotels-topbar">
        <div class="rf-hotels-topbar__utilities rf-hotels-topbar__utilities--spacer" aria-hidden="true"></div>
        <a href="rocco-forte-demo.html" class="rf-hotels-topbar__logo" aria-label="Rocco Forte Hotels home">
          <img src="rocco-forte-demo-assets/logo.png" width="120" height="42" alt="Rocco Forte Hotels">
        </a>
        <div class="rf-hotels-topbar__utilities">
          <span>English</span>
          <span>Currency</span>
          <a href="rocco-forte-demo.html" class="rf-hotels-topbar__close" aria-label="Close booking">&times;</a>
        </div>
      </div>

      <div class="rf-hotels-step-header">
        <button type="button" class="rf-hotels-step-header__modify" id="rfHotelsModifyDates">Modify Dates</button>
        <h1 class="rf-hotels-step-header__title">
          <span>Step 1</span>
          <span>Select Hotel</span>
        </h1>
        <span aria-hidden="true"></span>
      </div>

      <div class="rf-hotels-tabs">
        <div class="rf-hotels-tab" aria-current="step">
          <p class="rf-hotels-tab__name">Select hotel</p>
          <div class="rf-hotels-tab__dates" id="rfHotelsTabDates"></div>
          <span class="rf-hotels-tab__hotel-num">Hotel: 1</span>
        </div>
        <button type="button" class="rf-hotels-tab-add">add hotel +</button>
      </div>

      <div class="rf-hotels-empty" id="rfHotelsEmpty" hidden>
        <p>No booking dates found. <a href="rocco-forte-booking.html">Select dates</a> first.</p>
      </div>

      <div class="rf-hotels-split" id="rfHotelsSplit">
        <div class="rf-hotels-list" id="rfHotelsList" role="list"></div>
        <div class="rf-hotels-map-panel" id="rfHotelsMap" aria-label="Hotel locations map">
          <div class="rf-hotels-map-panel__viewport" id="rfHotelsMapViewport">
            <div class="rf-hotels-map-panel__scene" id="rfHotelsMapScene">
              <img
                class="rf-hotels-map-panel__img"
                id="rfHotelsMapImg"
                src="rocco-forte-demo-assets/europe-map.png"
                alt="Map of Europe showing Rocco Forte hotel locations"
                decoding="async"
                draggable="false"
              >
              <div class="rf-hotels-map-panel__markers" id="rfHotelsMapMarkers" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>

      <footer class="rf-hotels-footer">
        <a href="tel:+442073212626">+44 (0)20 7321 2626</a>
        &nbsp;&nbsp;|&nbsp;&nbsp;
        <a href="mailto:enquiries@roccofortehotels.com">enquiries@roccofortehotels.com</a>
      </footer>
    </div>
  </main>

  <button
    type="button"
    id="siteCloneBcFab"
    class="aep-bc-reopen-btn site-clone-bc-fab"
    hidden
    aria-label="Open Brand Concierge"
    aria-expanded="false"
    aria-controls="aepBcModal"
  >
    <img
      src="https://contenthosting.web.app/logos/adobe_icon_146235.webp"
      alt=""
      width="48"
      height="48"
      decoding="async"
    />
  </button>

  <div
    id="aepBcModal"
    class="aep-bc-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="aepBcModalTitle"
    hidden
  >
    <button type="button" class="aep-bc-modal__backdrop" data-aep-bc-close aria-label="Close dialog"></button>
    <div class="aep-bc-modal__dialog">
      <button type="button" class="aep-bc-modal__close" data-aep-bc-close aria-label="Close Brand Concierge">
        &times;
      </button>
      <h2 id="aepBcModalTitle" class="visually-hidden">Brand Concierge</h2>
      <div id="brand-concierge-mount" class="aep-bc-modal__mount"></div>
    </div>
  </div>

  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" aria-label="Primary"></aside>
    <div class="dashboard-main-wrap">
      <main class="dashboard-main app-page mod-demo-empty-main" aria-hidden="true"></main>
    </div>
  </div>

  <div id="profileViewerModalMount" data-aep-profile-viewer-modal-mount="1"></div>

  <script src="site-clone-bc.js?v=20260625-bc-aep-events-ecid"></script>
  <div id="brand-concierge-mount-host" aria-live="polite" hidden>
    <button type="button" id="aepBcDismissBtn" class="aep-bc-dismiss-btn" aria-label="Close Brand Concierge">×</button>
  </div>
  <script src="brand-concierge-controls.js?v=20260520-bc-controls"></script>
  <script defer src="aep-theme.js?v=20260421-fs-helper"></script>
  <script defer src="aep-theme-prefs.js?v=20260416d"></script>
  <script defer src="aep-lab-nav.js?v=20260625-rocco-forte"></script>
</body>
