<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;if(localStorage.getItem('aepTheme')==='dark')d.setAttribute('data-aep-theme','dark');else d.removeAttribute('data-aep-theme');if(localStorage.getItem('aepSidebarCollapsed')==='1')d.setAttribute('data-sidebar-collapsed','');else d.removeAttribute('data-sidebar-collapsed');var mp=localStorage.getItem('aepMenuPalette');if(mp&&mp!=='default')d.setAttribute('data-aep-menu-palette',mp);else d.removeAttribute('data-aep-menu-palette');var bp=localStorage.getItem('aepBgPreset');if(bp&&bp!=='default')d.setAttribute('data-aep-bg-preset',bp);else d.removeAttribute('data-aep-bg-preset');var st=localStorage.getItem('aepHomeDashboardSidebarTheme');if(st==='light')d.setAttribute('data-ajo-sidebar','light');else d.setAttribute('data-ajo-sidebar','dark');}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOD (British Army demo) – AEP Profile Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css?v=20260514-customer-demos-nav">
  <link rel="stylesheet" href="mod-demo.css?v=20260526-bc-env-grid">
  <link rel="stylesheet" href="site-clone-bc.css?v=20260527-site-clone-bc">
  <link rel="stylesheet" href="site-clone-bc-env-strip.css?v=20260601-env-strip-v2">
  <link rel="stylesheet" href="aep-demo-env-bar.css?v=20260601-sky-master">
  <link rel="stylesheet" href="brand-concierge-controls.css?v=20260520-bc-controls">
  <link rel="stylesheet" href="aep-profile-drawer.css?v=20260521-refresh-btn-lightfix">
  <link rel="stylesheet" href="shared/profile-viewer-modal.css?v=20260601-modal-central">
  <link rel="stylesheet" href="aep-theme.css?v=20260423b-fs-helper">
  <link rel="stylesheet" href="aep-theme-palettes.css?v=20260416c">
  <script>
    window.SiteCloneBcPage = {
      iframeId: 'siteCloneDemoSiteFrame',
      defaultFrameSrc: 'mod-demo-assets/army-home-snapshot.html',
      snapshotLayout: 'british-army-home',
    };
  </script>
  <script src="embed-bc/embed-bc-edge-path.js?v=20260519-bc-poll-fix"></script>
</head>
<body class="mod-demo-page home-dashboard-concierge">
  <!-- Lab identity strip: hover top edge to reveal (sits above embedded MOD site) -->
  <div class="mod-demo-top-anchor" id="modDemoTopAnchor">
    <div class="mod-demo-id-banner" role="region" aria-label="Customer identity">
      <div class="mod-demo-id-inner aep-demo-id-inner">
        <section class="aep-demo-env-section" id="aepDemoEnvSection" aria-label="AEP environment">
          <div class="aep-demo-env-editor" id="aepDemoEnvEditor">
            <div id="aepDemoEnvConfigGrid" class="aep-demo-env-collapsible">
              <span class="aep-demo-env-kicker">Environment</span>
              <div class="aep-demo-env-editor-grid">
                <div class="form-row">
                  <label for="sandboxSelect">Sandbox</label>
                  <select id="sandboxSelect" class="sandbox-select" aria-label="Select AEP sandbox">
                    <option value="">Loading sandboxes…</option>
                  </select>
                </div>
                <div
                  id="modSdkConfigFieldsMount"
                  data-demo-env-strip-mount="site-clone-tags"
                  data-demo-env-strip-prefix="mod"
                  data-demo-env-strip-default-bc-style="army"
                ></div>
                <div class="form-row">
                  <label for="generatorTarget">Event destination</label>
                  <select id="generatorTarget" aria-label="Edge or DCS streaming target"></select>
                </div>
              </div>
              <div id="modSdkConfigSummary" class="mod-sdk-summary mod-sdk-summary--below-env-grid" hidden>
                <span id="modSdkConfigSummaryText"></span>
                <button type="button" id="modChangeSdkConfigBtn" class="btn-lookup">Change SDK config</button>
              </div>
            </div>
            <div class="aep-demo-env-compact" id="aepDemoEnvCompact" hidden>
              <span class="aep-demo-env-compact-text" id="aepDemoEnvCompactText"></span>
              <button type="button" id="aepDemoEnvExpandBtn" class="btn-lookup aep-demo-env-expand-btn">Change environment</button>
            </div>
          </div>
        </section>
        <section class="aep-demo-profile-section" id="aepDemoProfileSection" aria-label="Profile lookup">
          <span class="aep-demo-env-kicker">Profile lookup</span>
          <div class="aep-demo-profile-section-grid">
            <div class="form-row">
              <label for="modNs">Namespace</label>
              <select id="modNs" class="sandbox-select" aria-label="Identity namespace">
                <option value="email">Email</option>
                <option value="ecid">ECID</option>
                <option value="crmId">CRM ID</option>
                <option value="loyaltyId">Loyalty ID</option>
                <option value="phone">Phone</option>
              </select>
            </div>
            <div class="form-row">
              <label for="customerEmail">Identifier value</label>
              <input type="text" id="customerEmail" placeholder="Enter identifier" autocomplete="off" spellcheck="false">
            </div>
            <div class="mod-demo-profile-actions">
              <button type="button" id="queryProfileBtn" class="btn-lookup">Look up profile</button>
              <span class="mod-demo-ecid-hint" id="ecidHint" aria-live="polite">ECID: <strong id="infoEcid">—</strong></span>
              <div id="siteCloneBcPrefsMount" data-demo-env-strip-mount="site-clone-bc-prefs"></div>
            </div>
          </div>
        </section>
      </div>
      <p class="mod-demo-script-preview">Selected script: <code id="modSelectedScript">None</code></p>
      <p id="modMessage" class="mod-demo-message" role="status" aria-live="polite" hidden></p>
      <p class="mod-demo-disclaimer">
        Embedded snapshot (saved HTML + local CSS mirror). Hero images load from <a href="https://www.army.mod.uk/" target="_blank" rel="noopener">army.mod.uk</a> media CDN. Not affiliated with the Ministry of Defence.
      </p>
    </div>
  </div>

  <!-- Injected / full screen: BC runs on parent (same Edge path as modal), positioned over the Army iframe -->
  <div id="siteCloneBcFrameHost" class="site-clone-bc-frame-host" hidden>
    <div id="siteCloneBcFrameMount" class="site-clone-bc-frame-mount"></div>
  </div>

  <iframe
    id="siteCloneDemoSiteFrame"
    class="mod-demo-site-frame"
    title="British Army — homepage snapshot (embedded)"
    src="mod-demo-assets/army-home-snapshot.html"
    referrerpolicy="no-referrer-when-downgrade"
    sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
    loading="eager"
  ></iframe>

  <!-- army-mod-home-3: floating FAB opens modal (visible when Modal is checked) -->
  <button
    type="button"
    id="siteCloneBcFab"
    class="aep-bc-reopen-btn site-clone-bc-fab"
    hidden
    aria-label="Open Brand Concierge"
    aria-expanded="false"
    aria-controls="aepBcModal"
  >
    <img
      src="https://contenthosting.web.app/logos/adobe_icon_146235.webp"
      alt=""
      width="48"
      height="48"
      decoding="async"
    />
  </button>

  <!-- army-mod-home-3: modal BC shell (BC mounts in #modDemoBcModalMount when Modal is checked) -->
  <div
    id="aepBcModal"
    class="aep-bc-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="aepBcModalTitle"
    hidden
  >
    <button type="button" class="aep-bc-modal__backdrop" data-aep-bc-close aria-label="Close dialog"></button>
    <div class="aep-bc-modal__dialog">
      <button type="button" class="aep-bc-modal__close" data-aep-bc-close aria-label="Close Brand Concierge">
        &times;
      </button>
      <h2 id="aepBcModalTitle" class="visually-hidden">Brand Concierge</h2>
      <div id="brand-concierge-mount" class="aep-bc-modal__mount"></div>
    </div>
  </div>

  <div class="mod-demo-sidebar-hover-zone" id="modDemoSidebarHoverZone" aria-hidden="true"></div>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" aria-label="Primary"></aside>
    <div class="dashboard-main-wrap">
      <main class="dashboard-main app-page mod-demo-empty-main" aria-hidden="true"></main>
    </div>
  </div>

  <div id="profileViewerModalMount" data-aep-profile-viewer-modal-mount="1"></div>

  <script src="firebase-database-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="aep-global-sandbox.js"></script>
  <script src="aep-lab-sandbox-sync.js?v=20260514-id-token-health"></script>
  <script src="email-cache.js"></script>
  <script src="identity-picker.js"></script>
  <script src="email-engagement-metrics.js"></script>
  <script src="shared/profile-viewer-modal.js?v=20260601-modal-central"></script>
  <script src="aep-profile-drawer.js?v=20260521-ns-autodetect"></script>
  <script src="aep-demo-web-push.js?v=20260512-lab-push"></script>
  <script src="shared/demo-env-strip.js?v=20260601-env-strip-mount-sync"></script>
  <script src="demo-tags-injection.js?v=20260601-tags-property-boot"></script>
  <script src="aep-demo-env-bar.js?v=20260601-launch-unset-expand"></script>
  <script src="aep-demo-generator-targets.js?v=20260508"></script>
  <script src="brand-concierge-styles-bundle.js?v=20260520-bc-bundle"></script>
  <script src="brand-concierge-toggle.js?v=20260526-bc-prefs-flush"></script>
  <script src="mod-demo.js?v=20260527-mod-site-clone-bc-env"></script>
  <script>
    window.SiteCloneDemoEnv = {
      storagePrefix: 'modDemo',
      webPushBySandboxKey: 'modDemoWebPushOnInjectBySandbox',
      webPushLegacyKey: 'modDemoWebPushOnInjectToggle',
      webPushToggleId: 'modWebPushOnInjectToggle',
      bcOnInjectToggleId: 'modBcOnInjectToggle',
      bcStyleSelectId: 'modBcStyleSelect',
      applyWebPushToggle: function () {
        if (typeof applyModWebPushOnInjectToggle === 'function') applyModWebPushOnInjectToggle();
      },
    };
  </script>
  <script src="site-clone-bc-env.js?v=20260529-bc-style-picker"></script>
  <script src="site-clone-bc.js?v=20260528-sky-injected-scroll"></script>
  <div id="brand-concierge-mount-host" aria-live="polite" hidden>
    <button type="button" id="aepBcDismissBtn" class="aep-bc-dismiss-btn" aria-label="Close Brand Concierge">×</button>
  </div>
  <script src="brand-concierge-controls.js?v=20260520-bc-controls"></script>
  <script defer src="aep-theme.js?v=20260421-fs-helper"></script>
  <script defer src="aep-theme-prefs.js?v=20260416d"></script>
  <script defer src="aep-lab-nav.js?v=20260520-miral-pages-removed"></script>
</body>
</html>
