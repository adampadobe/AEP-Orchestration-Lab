<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;if(localStorage.getItem('aepTheme')==='dark')d.setAttribute('data-aep-theme','dark');if(localStorage.getItem('aepSidebarCollapsed')==='1')d.setAttribute('data-sidebar-collapsed','');}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NatWest Decisioning - AEP Orchestration Lab</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css?v=20261015-natwest-rebuild">
  <link rel="stylesheet" href="mod-demo.css">
  <link rel="stylesheet" href="aep-profile-drawer.css?v=20261015-decisioning-details">
  <link rel="stylesheet" href="shared/profile-viewer-modal.css">
  <link rel="stylesheet" href="natwest-decisioning-demo.css?v=20261015-drawer">
  <link rel="stylesheet" href="decisioning-profile-hero.css?v=20261015-drawer">
  <link rel="stylesheet" href="decisioning-persona-journey.css?v=20261015-drawer">
  <link rel="stylesheet" href="aep-theme.css">
</head>
<body class="mod-demo-page nw-decisioning-page home-dashboard-concierge">
  <div class="mod-demo-top-anchor">
    <section class="mod-demo-id-banner" aria-label="Lab configuration">
      <div class="aep-demo-id-inner"
        data-demo-env-strip-mount="site-clone-shell"
        data-demo-env-strip-variant="spectrum"
        data-demo-env-strip-prefix="nwDecisioning"
        data-demo-env-strip-title="NatWest Decisioning"
        data-demo-env-strip-subtitle="Active Configuration"
        data-demo-env-strip-bc-bottom="1"
        data-demo-env-strip-message-id="nwDecisioningMessage"
        data-demo-env-strip-disclaimer="Internal test-profile demo. Objective ranking is simulated. Email desktop/mobile and Web preview the same live image decision; no messages are delivered. Captured website content is not a current product offer.">
      </div>
    </section>
  </div>
  <div class="nw-decisioning-actions" role="region" aria-label="Live decision controls">
    <button id="nwApplyProfile" type="button" disabled>Apply profile changes</button>
    <button id="nwRunDecision" type="button">Run live image decision</button>
    <span id="nwDecisionStatus">Local preview - no live decision applied.</span>
    <span id="nwProfileStatus" role="status" aria-live="polite">Look up a test profile to stage live changes.</span>
  </div>
  <iframe id="nwDecisioningFrame" class="mod-demo-site-frame" title="NatWest decisioning visualiser"
    src="natwest-decisioning-visualiser.html?v=20261015-rebuild"
    sandbox="allow-same-origin allow-scripts" loading="eager"></iframe>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" aria-label="Lab navigation"></aside>
    <div class="dashboard-main-wrap"><main class="dashboard-main" hidden></main></div>
  </div>
  <div id="profileViewerModalMount" data-aep-profile-viewer-modal-mount="1"></div>
  <script src="firebase-database-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="aep-global-sandbox.js"></script>
  <script src="aep-lab-sandbox-sync.js"></script>
  <script src="email-cache.js"></script>
  <script src="identity-picker.js"></script>
  <script src="email-engagement-metrics.js"></script>
  <script src="shared/profile-viewer-modal.js"></script>
  <script src="aep-profile-drawer.js?v=20261015-journey-views"></script>
  <script src="aep-demo-generator-targets.js"></script>
  <script src="natwest-decisioning-model.js?v=20261015-rebuild"></script>
  <script src="natwest-profile-hero.js?v=20261015-drawer"></script>
  <script>
    window.envBarConfig = {
      prefix: 'nwDecisioning', variant: 'spectrum', localOverride: true, firestoreListen: false,
      features: { webPush: false, bc: false, target: false, decisioning: true },
      iframeIds: ['nwDecisioningFrame'],
      decisioning: {
        iframeId: 'nwDecisioningFrame', useParentDocument: false, mountLayoutPreset: 'generic',
        autoRunDecisioning: false, viewName: 'NatWest Decisioning'
      },
      labCoreScript: 'natwest-decisioning-demo.js?v=20261015-drawer'
    };
  </script>
  <script src="decisioning-persona-journey.js?v=20261015-drawer"></script>
  <script src="shared/env-bar.js?v=20261014-shared-env-parity"></script>
  <script src="aep-lab-nav.js?v=20261015-natwest-rebuild"></script>
  <script src="aep-theme.js" defer></script>
</body>
</html>
