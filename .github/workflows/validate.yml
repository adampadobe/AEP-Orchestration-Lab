name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies (Node version check)
        working-directory: functions
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax
        run: python -m compileall -q proxy_server.py scripts/*.py

      - name: Validate architecture logo tags vs taxonomy
        run: python3 scripts/validate-architecture-logos-tags.py

      - name: Validate ecosystem vendor index vs SVG files
        run: python3 scripts/validate-ecosystem-vendor-index.py

      - name: Verify Profile Viewer decisioning routes (journey-arbitration redirects, v3, eds-quickstart)
        run: npm run verify:profile-viewer-routes

      - name: Verify production deployment policy
        run: node --test scripts/predeploy-policy.test.mjs

      - name: Verify owner-only usage statistics
        run: node --test functions/test/labUsage.test.cjs functions/test/labUsageTelemetry.test.cjs functions/test/labUsageInvocations.test.cjs functions/test/labUsageEngagement.test.cjs

      - name: Verify demo workspace APIs and UI regressions
        run: node --test functions/test/demo*.test.cjs

      - name: Install MCP dependencies
        working-directory: tools/aep-lab-profile-mcp
        run: npm ci

      - name: Verify MCP dispatch telemetry and existing authentication/tool registration
        run: node --test tools/aep-lab-profile-mcp/test/usageTelemetry.test.mjs tools/aep-lab-profile-mcp/test/imsAuth.test.mjs tools/aep-lab-profile-mcp/test/toolAnnotations.test.mjs tools/aep-lab-profile-mcp/test/focusedToolsets.test.mjs

      - name: Verify decisioning mount zones (site-clone demos)
        run: npm run verify:decisioning-mount-zones

      - name: Verify Experimentation Accelerator snapshot (customise + shell integration)
        run: npm run verify:experimentation-accelerator

      - name: JSON well-formed
        run: |
          python <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(".")
          paths = sorted(root.glob("samples/*.json")) + sorted(root.glob("schemas/*.json"))
          errs = []
          for p in paths:
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{p}: {e}")
          if errs:
              print("\n".join(errs), file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(paths)} JSON files")
          PY

  demo-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Exercise demo workspace with local fixtures (no production data)
        run: npm run test:demo-workspace-e2e
