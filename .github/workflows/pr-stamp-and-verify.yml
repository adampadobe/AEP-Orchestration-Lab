name: PR Stamp & Verify

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  stamp-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (fast)
        run: npm ci --no-audit --no-fund

      - name: Run predeploy check (may stamp files)
        run: node scripts/predeploy-check.mjs

      - name: Commit stamped files back to PR branch if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "[github-actions]"
            git config user.email "actions@github.com"
            git add functions/version.json web/version.json || true
            if git diff --cached --quiet; then
              echo "No relevant files to commit"
            else
              git commit -m "[apalmer] ci: stamp version files for PR #${{ github.event.number }}" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
              git push
            fi
          else
            echo "No changes from predeploy-check"
          fi

      - name: Run profile-viewer route verifier
        run: npm run verify:profile-viewer-routes
