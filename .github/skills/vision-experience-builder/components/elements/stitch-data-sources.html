<!--
  component: stitch-data-sources
  Four data-source pills "stitched" into a single unified profile pill, with
  pieces-fall-in animation per source then a pop on the unified result.
  The visual metaphor for CJA / RT-CDP identity stitch.

  Lives on a dark .datacard.

  Slots:
    SRC_1..SRC_4   short source labels (e.g. "Web SDK", "AJO", "Call logs", "OBR")
    UNIFIED_TITLE  e.g. "Sarah · K713"
    UNIFIED_SUB    e.g. "Stitched guest profile"

  Animation: sources fall in at .2 / .36 / .52 / .68s, arrow fades .95s,
  unified pops 1.15s.
-->
<style>
.stitch{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 16px;}
.stitch .src{flex:0 0 auto;width:104px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:13px 6px;text-align:center;}
.stitch .src .dot{width:9px;height:9px;border-radius:50%;background:var(--gold-lt);margin:0 auto 8px;}
.stitch .src .lb{font-size:13px;color:rgba(255,255,255,.85);font-weight:600;}
.stitch .arw{color:var(--gold-lt);font-size:30px;flex:0 0 auto;}
.stitch .unified{flex:0 0 auto;background:linear-gradient(160deg,rgba(176,144,59,.32),rgba(176,144,59,.06));border:1px solid var(--gold-lt);border-radius:12px;padding:14px 16px;text-align:center;color:#fff;min-width:120px;}
.stitch .unified b{font-size:15px;display:block;}
.stitch .unified span{font-size:12px;color:rgba(255,255,255,.7);}

.slide.active .stitch .src{animation:piece-in .5s both cubic-bezier(.22,1,.36,1);}
.slide.active .stitch .src:nth-child(1){animation-delay:.2s;}
.slide.active .stitch .src:nth-child(2){animation-delay:.36s;}
.slide.active .stitch .src:nth-child(3){animation-delay:.52s;}
.slide.active .stitch .src:nth-child(4){animation-delay:.68s;}
.slide.active .stitch .arw{animation:fade .5s .95s both;}
.slide.active .stitch .unified{animation:pop .55s 1.15s both cubic-bezier(.22,1,.36,1);}
</style>

<div class="stitch">
  <div class="src"><div class="dot"></div><div class="lb">SRC_1</div></div>
  <div class="src"><div class="dot"></div><div class="lb">SRC_2</div></div>
  <div class="src"><div class="dot"></div><div class="lb">SRC_3</div></div>
  <div class="src"><div class="dot"></div><div class="lb">SRC_4</div></div>
  <div class="arw">&rarr;</div>
  <div class="unified"><b>UNIFIED_TITLE</b><span>UNIFIED_SUB</span></div>
</div>
