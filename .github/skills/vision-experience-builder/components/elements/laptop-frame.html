<!-- laptop-frame — generic laptop device frame for browser/desktop moments.
     Derived from devices.css (MIT, (c) 2014 Marvelapp) — LICENSE + NOTICE in vendor/devices-css/.
     Genericized: renamed out of the marvel namespace, no brand marks; on-slide it is

     Usage: put the page mock inside .screen (pairs with elements/browser-frame.html
     content, dashboards, web apps). Native ~960x600; scale via transform.
     Slot the persona photo BEHIND it per the photo-composite pattern (§12). -->
<div class="esb-laptop">
  <div class="top-bar"></div>
  <div class="camera"></div>
  <div class="screen">
    <!-- data-slot: page mock goes here (960x600) -->
  </div>
  <div class="bottom-bar"></div>
</div>
<style>
.esb-laptop{display:inline-block;position:relative;-webkit-box-sizing:content-box !important;box-sizing:content-box !important}.esb-laptop .screen{width:100%;position:relative;height:100%;z-index:3;background:white;overflow:hidden;display:block;border-radius:1px;-webkit-box-shadow:0 0 0 3px #111;box-shadow:0 0 0 3px #111}.esb-laptop{width:940px;height:588px;padding:38px 38px 66px;margin:0 auto;background:#bebebe;border-radius:22px}.esb-laptop:before{width:calc(100% - 8px);height:calc(100% - 8px);position:absolute;content:'';display:block;top:4px;left:4px;border-radius:30px;background:#1e1e1e}.esb-laptop .top-bar{width:calc(100% + 2 * 70px);height:40px;position:absolute;content:'';display:block;top:652px;left:-70px;border-bottom-left-radius:64px 12px;border-bottom-right-radius:64px 12px;background:#bebebe;-webkit-box-shadow:inset 0px -4px 13px 3px rgba(34,34,34,0.6);box-shadow:inset 0px -4px 13px 3px rgba(34,34,34,0.6)}.esb-laptop .top-bar:before{width:100%;height:24px;content:'';display:block;top:0;left:0;background:#f0f0f0;border-bottom:2px solid #aaa;border-radius:5px;position:relative}.esb-laptop .bottom-bar{background:transparent;width:calc(100% + 2 * 70px);height:26px;position:absolute;content:'';display:block;top:652px;left:-70px}.esb-laptop .bottom-bar:before,.esb-laptop .bottom-bar:after{height:calc(100% - 2px);width:80px;content:'';display:block;top:0;position:absolute}.esb-laptop .bottom-bar:before{left:0;background:#f0f0f0;background:-webkit-gradient(linear, left top, right top, from(#747474), color-stop(5%, #c3c3c3), color-stop(14%, #ebebeb), color-stop(41%, #979797), color-stop(80%, #f0f0f0), color-stop(100%, #f0f0f0), to(#f0f0f0));background:linear-gradient(to right, #747474 0%, #c3c3c3 5%, #ebebeb 14%, #979797 41%, #f0f0f0 80%, #f0f0f0 100%, #f0f0f0 100%)}.esb-laptop .bottom-bar:after{right:0;background:#f0f0f0;background:-webkit-gradient(linear, left top, right top, from(#f0f0f0), color-stop(0%, #f0f0f0), color-stop(20%, #f0f0f0), color-stop(59%, #979797), color-stop(86%, #ebebeb), color-stop(95%, #c3c3c3), to(#747474));background:linear-gradient(to right, #f0f0f0 0%, #f0f0f0 0%, #f0f0f0 20%, #979797 59%, #ebebeb 86%, #c3c3c3 95%, #747474 100%)}.esb-laptop .camera{background:#3c3d3d;width:10px;height:10px;position:absolute;top:16px;left:50%;margin-left:-5px;border-radius:100%}
</style>
