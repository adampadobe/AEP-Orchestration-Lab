<!--
  component: touchpoint-chain
  Sequential left-to-right chain of channels, with ONE node marked .key
  (gold disc, pulses). The reveal lights up node-by-node every 150ms,
  then the key node pulses on a 2.2s loop from +1.5s.

  Lives inside a `.datacard` (dark gradient panel) — see big-number-money-reveal.

  Use when you want to say "the channels stitched together earned this" —
  the gold key node carries the punchline (Phone, Email, Push, etc.).

  Each .node should carry an inline SVG matching the channel (see icons.svg.md).
  Don't use emoji.
-->
<style>
.chain{display:flex;justify-content:space-between;align-items:flex-start;position:relative;margin-bottom:46px;}
.chain:before{content:"";position:absolute;left:24px;right:24px;top:27px;height:2px;background:rgba(255,255,255,.18);}
.node{display:flex;flex-direction:column;align-items:center;gap:10px;width:96px;position:relative;z-index:2;}
.node .disc{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;}
.node.key .disc{background:var(--gold);border-color:var(--gold-lt);box-shadow:0 0 0 6px rgba(176,144,59,.22);}
.node .disc svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;}
.node .lb{font-size:13px;color:rgba(255,255,255,.78);text-align:center;}

/* sequential reveal of up to 7 nodes (matches the £6,361 reveal) */
.slide.active .datacard .node{animation:pop .5s both cubic-bezier(.22,1,.36,1);}
.slide.active .datacard .node:nth-child(1){animation-delay:.15s;}
.slide.active .datacard .node:nth-child(2){animation-delay:.30s;}
.slide.active .datacard .node:nth-child(3){animation-delay:.45s;}
.slide.active .datacard .node:nth-child(4){animation-delay:.60s;}
.slide.active .datacard .node:nth-child(5){animation-delay:.75s;}
.slide.active .datacard .node:nth-child(6){animation-delay:.90s;}
.slide.active .datacard .node:nth-child(7){animation-delay:1.05s;}
.slide.active .datacard .node.key .disc{animation:keypulse 2.2s 1.5s ease-in-out infinite;}
</style>

<div class="chain">
  <div class="node"><div class="disc"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff"/></svg></div><div class="lb">Instagram</div></div>
  <div class="node"><div class="disc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></div><div class="lb">Browse</div></div>
  <div class="node"><div class="disc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="#fff"/></svg></div><div class="lb">Personalise</div></div>
  <div class="node"><div class="disc"><svg viewBox="0 0 24 24"><path d="M5 7h14l-1 13H6L5 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg></div><div class="lb">Basket</div></div>
  <div class="node"><div class="disc"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg></div><div class="lb">Recovery</div></div>
  <div class="node key"><div class="disc"><svg viewBox="0 0 24 24"><path d="M6 3c2 0 3 4 3 6l-2 2c1 2 4 5 6 6l2-2c2 0 6 1 6 3v3c0 1-1 2-3 2C9 23 1 15 1 6 1 4 2 3 3 3z" fill="#fff" stroke="none"/></svg></div><div class="lb">Phone</div></div>
  <div class="node"><div class="disc"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 18 0H3z"/><path d="M12 3v9M12 21a2 2 0 0 1-2-2"/></svg></div><div class="lb">Excursions</div></div>
</div>
