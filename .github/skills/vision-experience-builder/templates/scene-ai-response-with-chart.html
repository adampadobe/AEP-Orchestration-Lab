}

*/

  left: 940px;
  top: 312px;
  width: 860px;
  height: 600px;
  overflow: hidden;
}

/* ---- Chart card container ----
   Both charts use the same card styling.
   White fill, #6349E0 border, 26px radius, shadow.
*/
.chart-card {
  position: absolute;
  left: 0;
  width: 820px;
  background: #FFFFFF;
  border: 1.7px solid #6349E0;
  border-radius: 26px;
  box-shadow: 0 4px 18px 3px rgba(0, 0, 0, 0.10);
  overflow: hidden;
}

/* Chart 1 — fully visible in both steps */
.chart-card--1 {
  top: 0;
  height: 310px;
  opacity: 0;
}

/* Chart 2 — entering from below in step 1, fully visible in step 2 */

  top: 330px;     /* step 2 fully visible position */
  height: 240px;
}

/* Chart card header */
.chart-card__title {
  font-size: 28px;
  font-weight: 700;
  color: #2C2C2C;
  padding: 22px 32px 0;
  margin: 0 0 8px;
}

/* ---- Bar chart within chart card ---- */
.chart-bars {
  display: flex;
  align-items: flex-end;
  gap: 18px;
  padding: 8px 32px 28px;
  height: 220px;
  box-sizing: border-box;
}

/* Series legend */
.chart-legend {
  display: flex;
  gap: 20px;
  padding: 0 32px 4px;
}

.chart-legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 16px;
  font-weight: 700;
  color: #6E6E6E;
}

.chart-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}

.chart-legend-dot--a { background: #96A3F9; }
.chart-legend-dot--b { background: #6D5FEB; }

/* Bar group */
.bar-group {
  display: flex;
  align-items: flex-end;
  gap: 5px;
  flex: 1;
}

.bar {
  flex: 1;
  border-radius: 6px 6px 0 0;
  min-height: 8px;
  /* height set via style attribute as percentage of 160px bar area */
}

.bar--series-a { background: #96A3F9; }
.bar--series-b { background: #6D5FEB; }

/* Axis baseline */
.chart-axis {
  height: 2px;
  background: rgba(99, 73, 224, 0.15);
  margin: 0 32px;
}

/* ---- Chart 2 — engagement line chart (simplified) ---- */
.chart-card--2 .chart-card__title {
  font-size: 24px;
  padding-top: 18px;
}

.chart-line-placeholder {
  margin: 8px 32px 20px;
  height: 120px;
  background: linear-gradient(90deg,
    rgba(150, 163, 249, 0.15) 0%,
    rgba(99, 73, 224, 0.10) 100%
  );
  border-radius: 8px;
  position: relative;
  overflow: hidden;
}

/* Simplified SVG line chart drawn with CSS */
.chart-line-placeholder::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(135deg,
      transparent 0%, transparent 15%,
      rgba(109, 95, 235, 0.6) 15%, rgba(109, 95, 235, 0.6) 17%,
      transparent 17%, transparent 30%,
      rgba(150, 163, 249, 0.8) 30%, rgba(150, 163, 249, 0.8) 32%,
      transparent 32%, transparent 50%,
      rgba(109, 95, 235, 0.6) 50%, rgba(109, 95, 235, 0.6) 52%,
      transparent 52%
    );
}

/* ---- Step-specific visibility ----
   Step 1: chart-2 enters from below (peek)
   Step 2: chart-2 is fully visible; chart-3 enters
*/
.slide--ai-step-1 .chart-card--2 {
  top: 360px;
  height: 200px;
  /* Rotated, peeking up from below fold — matches Figma pattern */
  transform: rotate(7deg) translateY(80px);
  opacity: 0;
}

.slide--ai-step-2 .chart-card--2 {
  top: 330px;
  transform: rotate(0deg) translateY(0);
  opacity: 0;
}

/* Step 2: second finding visible (hidden in step 1 via separate section) */

/* ---- Nav dots — white variant ---- */
.nav-dots--light {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  height: 695px;
  z-index: 20;
}

.nav-dots--light .nd {
  width: 4.4px;
  height: 4.4px;
  border-radius: 62.8px;
  background: rgba(255, 255, 255, 0.20);
  flex-shrink: 0;
  display: block;
}

.nav-dots--light .nd.nd--active {
  background: rgba(255, 255, 255, 0.80);
  outline: 3px solid rgba(255, 255, 255, 0.80);
  outline-offset: 0;
}

/* ---- Animations ---- */
@keyframes chart-enter {
  from { opacity: 0; transform: translateY(60px) rotate(7deg); }
  to   { opacity: 1; transform: translateY(0) rotate(0deg);    }
}

@keyframes chart-peek-in {
  from { opacity: 0; transform: rotate(7deg) translateY(120px); }
  to   { opacity: 0.7; transform: rotate(7deg) translateY(80px); }
}

@keyframes finding-in {
  from { opacity: 0; transform: translateX(-24px); }
  to   { opacity: 1; transform: translateX(0);     }
}

/* ============================================================
   ANIMATION TRIGGERS
   Elements start opacity:0 (set above). Animations only fire
   when the parent .slide gains .active. The deck JS must call
   void slide.offsetWidth before adding .active to restart
   animations on each revisit.
   ============================================================ */
/* Chart 1 — both steps */
.slide.active .chart-card--1 { animation: chart-enter 600ms 200ms cubic-bezier(0.22,1,0.36,1) both; }

/* Step 1: chart-2 peeks from below */
.slide--ai-step-1.active .chart-card--2 { animation: chart-peek-in 700ms 400ms cubic-bezier(0.22,1,0.36,1) both; }

/* Step 2: chart-2 fully enters */
.slide--ai-step-2.active .chart-card--2 { animation: chart-enter 600ms cubic-bezier(0.22,1,0.36,1) both; }

/* Findings — staggered per step */
.slide--ai-step-1.active .ai-resp__finding:nth-child(1) { animation: finding-in 500ms 300ms cubic-bezier(0.22,1,0.36,1) both; }
.slide--ai-step-2.active .ai-resp__finding:nth-child(1) { animation: finding-in 500ms 0ms cubic-bezier(0.22,1,0.36,1) both; }
.slide--ai-step-2.active .ai-resp__finding:nth-child(2) { animation: finding-in 500ms 150ms cubic-bezier(0.22,1,0.36,1) both; }
