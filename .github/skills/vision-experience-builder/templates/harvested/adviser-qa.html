<!-- template: adviser-qa  (standalone drop-in slide, harvested from coventry-bs; rebrand via :root tokens) -->
<style>
.slide{position:absolute; inset:0; padding:96px 86px 92px; display:flex; flex-direction:column;
    opacity:0; visibility:hidden; pointer-events:none; transform:scale(.985);
    transition:opacity var(--t-slide) var(--ease), transform var(--t-slide) var(--ease), visibility 0s linear var(--t-slide);}
.slide.active{opacity:1; visibility:visible; pointer-events:auto; transform:scale(1);
    transition:opacity var(--t-slide) var(--ease), transform var(--t-slide) var(--ease), visibility 0s;}
.anim{opacity:0; transform:translate(calc(var(--ox)*1px), calc(var(--oy)*1px));
    transition:opacity var(--t-in) var(--ease), transform var(--t-in) var(--ease);}
.slide.active .anim{opacity:1; transform:none; transition-delay:calc(var(--i,0) * var(--t-step));}
.anim.pop{transform:translateY(20px) scale(.94);}
.eyebrow{font-size:13px; letter-spacing:.32em; text-transform:uppercase; color:var(--accent); font-weight:700;}
/* ---------- Priya photo (transparent figure on paper) ---------- */
  .slide.has-photo{padding:0; gap:0;}
.pcontent{width:55%; height:100%; display:flex; flex-direction:column; justify-content:center; padding:92px 40px 92px 86px; position:relative; z-index:2;}
.has-photo .points{margin-top:8px;}
.has-photo .narr{max-width:30ch; font-size:23px;}
.photo-panel{position:absolute; top:0; right:2.5%; bottom:0; width:46%; z-index:1;
    display:flex; align-items:flex-end; justify-content:center; pointer-events:none;}
.photo-panel img{max-width:100%; max-height:99%; object-fit:contain;
    filter:drop-shadow(0 26px 30px rgba(12,42,86,.18));}
.photo-panel .fade{display:none;}
.adv-card .big{font-size:18px; font-weight:800; color:#0a2f5c; margin-top:5px; letter-spacing:-.01em;}
/* Jamie's live question bubble (S10) */
  .adv-q{position:absolute; left:42.5%; top:9.5%; width:30%; z-index:4; display:flex; align-items:flex-start; gap:10px;
    font-family:"Avenir Next Cyr"; opacity:0; transform:translateY(10px) scale(.97);
    transition:opacity .5s var(--ease), transform .5s var(--ease-bk); pointer-events:none;}
.adv-q.in{opacity:1; transform:none;}
.adv-q-ava{width:40px; height:40px; border-radius:50%; overflow:hidden; flex:none; border:2px solid #fff;
    box-shadow:0 8px 18px -8px rgba(12,42,86,.5);}
.adv-q-ava img{width:100%; height:100%; object-fit:cover; display:block;}
.adv-q-bubble{position:relative; background:#1763cf; color:#fff; border-radius:14px; border-top-left-radius:4px;
    padding:9px 13px; box-shadow:0 20px 44px -18px rgba(12,42,86,.55); max-width:300px;}
.adv-q-bubble::before{content:""; position:absolute; left:-6px; top:11px; width:0; height:0;
    border:6px solid transparent; border-right-color:#1763cf; border-left:0;}
.adv-q-who{display:flex; align-items:center; gap:5px; font-size:8px; font-weight:800; letter-spacing:.05em;
    text-transform:uppercase; opacity:.85; margin-bottom:4px;}
.adv-q-who svg{width:11px; height:11px;}
.adv-q-text{font-size:12.5px; font-weight:700; line-height:1.34;}
.adv-q-caret{display:inline-block; width:2px; height:1em; background:#fff; margin-left:1px; vertical-align:-2px;
    animation:advCaret .9s steps(1,end) infinite;}
/* S10 hero: question only, centred + enlarged */
  .adv-q.big{left:66%; top:53%; width:52%; transform:translate(-50%,-50%); gap:16px; align-items:center;
    transition:opacity .55s var(--ease);}
.adv-q.big.in{transform:translate(-50%,-50%);}
.adv-q.big .adv-q-ava{width:72px; height:72px; border-width:3px;}
.adv-q.big .adv-q-bubble{border-radius:22px; border-top-left-radius:6px; padding:18px 26px; max-width:none;
    transform:translateY(10px) scale(.97); transition:transform .55s var(--ease-bk);}
.adv-q.big.in .adv-q-bubble{transform:none;}
.adv-q.big .adv-q-bubble::before{top:20px; border-width:10px; border-right-width:11px;}
.adv-q.big .adv-q-who{font-size:11px; gap:7px; margin-bottom:8px;}
.adv-q.big .adv-q-who svg{width:15px; height:15px;}
.adv-q.big .adv-q-text{font-size:23px; line-height:1.36; font-weight:800;}
/* ---------- shared recap split-screen ---------- */
  .slide.recap{padding:0;}
/* ---------- stage ---------- */
  .stage{flex-direction:row; gap:56px; align-items:center;}
.stage .col-main{flex:1.25;}
.stage .col-side{flex:1;}
.stage-head{display:flex; align-items:baseline; gap:18px; margin:14px 0 26px;}
.snum{font-family:"Avenir Next Cyr"; font-weight:700; font-size:34px; color:var(--accent); letter-spacing:-.01em;}
.stage-head h2{font-family:"Avenir Next Cyr"; font-weight:600; font-size:46px; letter-spacing:-.02em; line-height:1;}
.col-label{font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:14px;}
.narr{font-size:24px; line-height:1.5; color:var(--ink); max-width:33ch; font-weight:400;}
.narr.dash{font-family:"Avenir Next Cyr"; font-size:60px; color:var(--faint);}
</style>
