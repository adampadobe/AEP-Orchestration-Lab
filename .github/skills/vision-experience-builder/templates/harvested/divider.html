<!-- template: divider  (standalone drop-in slide, harvested from po-cruises; rebrand via :root tokens) -->
<style>
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;visibility:hidden;opacity:0;
  pointer-events:none;transition:opacity .5s ease;}
.slide.active{visibility:visible;opacity:1;pointer-events:auto;z-index:1;}
.slide.active .a1{animation:rise .7s .10s both cubic-bezier(.22,1,.36,1);}
.slide.active .a2{animation:rise .7s .22s both cubic-bezier(.22,1,.36,1);}
.slide.active .a3{animation:rise .7s .34s both cubic-bezier(.22,1,.36,1);}
.slide.active .a4{animation:rise .7s .46s both cubic-bezier(.22,1,.36,1);}
.slide.active .a5{animation:rise .7s .58s both cubic-bezier(.22,1,.36,1);}
.slide.active .a6{animation:rise .7s .70s both cubic-bezier(.22,1,.36,1);}
.slide.active .fp{animation:fade .9s .2s both;}
.slide.active .pp{animation:pop .6s .5s both cubic-bezier(.22,1,.36,1);}
.rcard .ph{width:200px;height:118px;border-radius:8px;flex-shrink:0;background:linear-gradient(160deg,#7FB7D8,#9ED0C5 60%,#cfe8b8);position:relative;overflow:hidden;}
.rcard .ph:after{content:none;}
.pbody .pk{font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;}
.slide.active .jpath{animation:draw 2.4s .3s ease forwards;}
.slide.active .jnode{animation:pop .6s both cubic-bezier(.22,1,.36,1);}
/* ===== margaret divider ===== */
.divider{position:absolute;inset:0;background:linear-gradient(160deg,#0E2A5E,#173A87);display:grid;place-items:center;text-align:center;overflow:hidden;}
.divider .glw{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(201,162,74,.25),transparent 55%);}
.divider .pk{font-size:20px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-lt);}
.divider h1{font-size:128px;font-weight:300;color:#fff;margin:14px 0 6px;line-height:1;}
.divider .ph{font-size:34px;color:rgba(255,255,255,.8);}
.divider .pill{margin-top:26px;display:inline-block;border:1px solid rgba(201,162,74,.6);color:var(--gold-lt);font-size:16px;letter-spacing:.18em;text-transform:uppercase;padding:9px 22px;border-radius:999px;}
/* reveal touchpoint chain — light up in sequence, phone pulses */
.slide.active .datacard .node{animation:pop .5s both cubic-bezier(.22,1,.36,1);}
.slide.active .datacard .node:nth-child(1){animation-delay:.15s;}
.slide.active .datacard .node:nth-child(2){animation-delay:.30s;}
.slide.active .datacard .node:nth-child(3){animation-delay:.45s;}
.slide.active .datacard .node:nth-child(4){animation-delay:.60s;}
.slide.active .datacard .node:nth-child(5){animation-delay:.75s;}
.slide.active .datacard .node:nth-child(6){animation-delay:.90s;}
.slide.active .datacard .node:nth-child(7){animation-delay:1.05s;}
.slide.active .datacard .node.key .disc{animation:keypulse 2.2s 1.5s ease-in-out infinite;}
.slide.active .jship{animation:sail 2.4s .35s ease forwards;}
.slide.active .profilebar .pp.np{animation:pop .55s .7s both cubic-bezier(.22,1,.36,1);}
/* AJO offer ranking settle */
.slide.active .offer{animation:rise .5s both cubic-bezier(.22,1,.36,1);}
.slide.active .offer:nth-child(3){animation-delay:.15s;}
.slide.active .offer:nth-child(2){animation-delay:.35s;}
.slide.active .offer:nth-child(1){animation-delay:.55s;}
.slide.active .offer.top .badge{animation:pop .5s 1.2s both cubic-bezier(.22,1,.36,1);}
.slide.active .email-toast{animation:toast-in .6s 1.2s both cubic-bezier(.22,1,.36,1);}
.phone-photo{position:absolute;right:90px;top:118px;width:620px;height:846px;object-fit:cover;object-position:center;border-radius:18px;box-shadow:0 30px 70px rgba(16,32,70,.22);}
.slide.active .call-card .cc-end{animation:callring 1.4s .6s ease-out infinite;}
.slide.active .confirmed-card{animation:pop .6s 1.9s both cubic-bezier(.22,1,.36,1);}
.slide.active .stitch .src{animation:piece-in .5s both cubic-bezier(.22,1,.36,1);}
.slide.active .stitch .src:nth-child(1){animation-delay:.2s;}
.slide.active .stitch .src:nth-child(2){animation-delay:.36s;}
.slide.active .stitch .src:nth-child(3){animation-delay:.52s;}
.slide.active .stitch .src:nth-child(4){animation-delay:.68s;}
.slide.active .stitch .arw{animation:fade .5s .95s both;}
.slide.active .stitch .unified{animation:pop .55s 1.15s both cubic-bezier(.22,1,.36,1);}
.slide.active .cja-inset{animation:rise .7s 1.5s both cubic-bezier(.22,1,.36,1);}
.slide.active .tslide .t-eye{animation:fade .8s .2s both;}
.slide.active .tslide .t-big{animation:rise .9s .35s both cubic-bezier(.22,1,.36,1);}
.slide.active .tslide .t-rule{animation:t-rule-in .7s .9s both;}
.slide.active .tslide .t-sub{animation:rise .8s 1.05s both cubic-bezier(.22,1,.36,1);}
.slide.active .closing-win{animation:win-close 1.5s 1.2s forwards cubic-bezier(.5,0,.75,0);}
.slide.active .abandon-card{animation:fade .8s 2.6s both;}
.slide.active .bbar .u.typed{animation:typeurl 1.0s .5s steps(13) forwards, caretblink .7s .5s 4 step-end;}
/* ===== Batch 3: email-on-phone ===== */
.phoneframe{position:absolute;left:50%;top:92px;transform:translateX(-50%);width:392px;height:796px;background:#0b1730;border-radius:50px;padding:13px;box-shadow:0 34px 80px rgba(16,32,70,.4);z-index:4;}
.phoneframe .pscreen{width:100%;height:100%;border-radius:38px;overflow:hidden;position:relative;background:#0E2A5E;}
.phoneframe .wall{position:absolute;inset:0;background:url(dest-med-town.jpg) center/cover;filter:brightness(.82);}
.phoneframe .pstatus{position:absolute;top:0;left:0;right:0;height:42px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;z-index:3;}
.ph-notif{position:absolute;top:74px;left:14px;right:14px;background:rgba(255,255,255,.97);border-radius:20px;padding:13px 15px;display:flex;gap:11px;z-index:4;box-shadow:0 12px 34px rgba(0,0,0,.32);opacity:0;}
.ph-notif .ic{width:38px;height:38px;border-radius:9px;background:#173A87;color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;flex-shrink:0;}
.ph-notif .nf{font-size:12px;color:#5B6573;font-weight:700;}
.ph-notif .ns2{font-size:14px;color:#15203A;font-weight:800;margin:1px 0;}
.ph-notif .np{font-size:12px;color:#5B6573;line-height:1.35;}
.slide.active .ph-notif{animation:rise .6s .9s both cubic-bezier(.22,1,.36,1);}
.ph-email{position:absolute;inset:0;background:#fff;opacity:0;z-index:5;display:flex;flex-direction:column;overflow:hidden;}
.slide.active .ph-email{animation:fade .55s 2.5s both;}
/* iOS Mail style nav bar */
.ph-email .enav{display:flex;align-items:center;justify-content:space-between;padding:42px 14px 8px;border-bottom:1px solid #ECEEF2;background:#F8F9FB;flex-shrink:0;}
.ph-email .enav .eninbox{display:flex;align-items:center;gap:4px;color:#0B5CD8;font-size:15px;font-weight:600;}
.ph-email .enav .eninbox svg{width:11px;height:18px;}
.ph-email .enav .enright{display:flex;gap:18px;align-items:center;}
.ph-email .enav .enright svg{width:18px;height:18px;fill:none;stroke:#0B5CD8;stroke-width:2;}
/* subject hero */
.ph-email .esubj{font-size:22px;font-weight:800;color:#15203A;line-height:1.18;padding:14px 16px 6px;letter-spacing:-.01em;}
/* sender row */
.ph-email .efrm{display:flex;align-items:flex-start;gap:11px;padding:10px 16px 14px;border-bottom:1px solid #F0F2F6;}
.ph-email .eav{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#173A87,#0B5CD8);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex-shrink:0;letter-spacing:.02em;}
.ph-email .efrm .who{flex:1;min-width:0;}
.ph-email .efrm .who .nm{font-size:14px;font-weight:800;color:#15203A;display:flex;align-items:center;gap:6px;}
.ph-email .efrm .who .to{font-size:12px;color:#8A94A6;margin-top:2px;display:flex;align-items:center;gap:4px;}
.ph-email .efrm .who .to svg{width:9px;height:9px;}
.ph-email .efrm .rt{font-size:12px;color:#8A94A6;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-weight:600;flex-shrink:0;}
.ph-email .efrm .rt .star svg{width:18px;height:18px;fill:none;stroke:#C9CFDA;stroke-width:2;}
/* body */
.ph-email .eb{flex:1;overflow:hidden;padding:16px;font-size:13px;color:#15203A;line-height:1.55;}
.ph-email .eb p{margin-bottom:10px;}
.ph-email .ehero{height:128px;border-radius:10px;background:url(dest-cruise-ship.jpg) center/cover;margin-bottom:14px;position:relative;overflow:hidden;}
.ph-email .ehero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(11,31,63,.45));}
.ph-email .epreh{font-size:11px;color:#8A94A6;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;}
.ph-email .esig{font-size:12px;color:#5B6573;margin-top:14px;padding-top:12px;border-top:1px solid #F0F2F6;line-height:1.5;}
/* call CTA */
.ph-call{display:flex;align-items:center;gap:9px;margin-top:14px;background:linear-gradient(180deg,#0B5CD8,#0747A6);color:#fff;border-radius:12px;padding:13px;font-weight:800;font-size:14.5px;justify-content:center;box-shadow:0 6px 18px rgba(11,92,216,.35);}
.ph-call svg{width:17px;height:17px;fill:#fff;flex-shrink:0;}
/* bottom action bar */
.ph-email .ebot{border-top:1px solid #ECEEF2;background:#F8F9FB;padding:10px 24px 14px;display:flex;justify-content:space-around;align-items:center;flex-shrink:0;}
.ph-email .ebot svg{width:22px;height:22px;fill:none;stroke:#0B5CD8;stroke-width:2;}
.ph-email .ph-alt{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:11px;font-size:12.5px;color:#5B6573;}
.ph-email .ph-alt svg{width:13px;height:13px;fill:#5B6573;flex-shrink:0;}
.ph-email .ph-alt b{color:#15203A;}
.slide.active .ph-call{animation:tapnum 1.3s 3.9s ease both;}
.slide.dark-counter ~ .counter{color:rgba(255,255,255,.6);}
</style>
<section class="slide divider dark-counter">
    <div class="glw"></div>
    <div><div class="pk">The Future State</div><h1>Margaret Holloway</h1><p class="ph">The Loyal Guest</p><div><span class="pill">Post-MVP</span></div></div>
  </section>
