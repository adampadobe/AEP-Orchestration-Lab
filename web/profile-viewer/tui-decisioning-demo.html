<head>

<body class="mod-demo-page home-dashboard-concierge tui-demo-shell">
  <div class="mod-demo-top-anchor">
    <section class="mod-demo-id-banner" aria-label="Lab configuration">
      <div class="aep-demo-id-inner"
        data-demo-env-strip-mount="site-clone-shell"
        data-demo-env-strip-variant="spectrum"
        data-demo-env-strip-prefix="tuiDecisioning"
        data-demo-env-strip-title="TUI Holiday Decisioning"
        data-demo-env-strip-subtitle="Active Configuration"
        data-demo-env-strip-message-id="tuiDecisioningMessage"
        data-demo-env-strip-bc-bottom="1"
        data-demo-env-strip-disclaimer="Internal test-profile demo. Local ranking is a simulation; Run uses the configured live policy, not automatically the TUI drafts. No messages are delivered.">
      </div>
    </section>
  </div>
  <div class="tui-live-actions" aria-label="Decision controls">
    <button id="tuiApplyProfile" type="button" disabled>Apply profile changes</button>
    <button id="tuiRunDecision" type="button">Run live decision</button>
    <span id="tuiLiveStatus" role="status" aria-live="polite">Local simulation. Look up a test profile to stage changes.</span>
  </div>
  <iframe id="tui-visualiser" class="mod-demo-site-frame" title="TUI holiday decisioning simulator"
    src="tui-decisioning-visualiser.html?v=20261016-shell" sandbox="allow-same-origin allow-scripts" loading="eager"></iframe>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" aria-label="Lab navigation"></aside>
    <div class="dashboard-main-wrap"><main class="dashboard-main" hidden></main></div>
  </div>
  <div id="profileViewerModalMount" data-aep-profile-viewer-modal-mount="1"></div>

  <script src="tui-decisioning-profile.js?v=20261016-shell"></script>
  <script src="tui-profile-hero.js?v=20261016-shell"></script>
  <script>
    (function(){
      var frame=document.getElementById('tui-visualiser');
      var channel=new URLSearchParams(location.search).get('channel');
      if(['email','mobile','web'].includes(channel))frame.src+='&channel='+channel;
      function theme(){frame.contentWindow.postMessage({type:'tui-theme',dark:document.documentElement.getAttribute('data-aep-theme')==='dark'},location.origin);}
      frame.addEventListener('load',theme);
      new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-aep-theme']});
      window.addEventListener('message',function(event){
        if(event.origin!==location.origin||event.source!==frame.contentWindow||!event.data||event.data.type!=='tui-channel')return;
        if(!['email','mobile','web'].includes(event.data.channel))return;
        var url=new URL(location.href);url.searchParams.set('channel',event.data.channel);history.pushState({},'',url);
      });
      window.addEventListener('popstate',function(){frame.contentWindow.postMessage({type:'tui-set-channel',channel:new URLSearchParams(location.search).get('channel')||'email'},location.origin);});
    })();
    window.envBarConfig = {
      prefix: 'tuiDecisioning', variant: 'spectrum', defaultSandbox: 'kirkham', localOverride: true, firestoreListen: false,
      features: { webPush: false, bc: false, target: false, decisioning: true },
      iframeIds: ['tui-visualiser'],
      decisioning: { iframeId: 'tui-visualiser', useParentDocument: false, mountLayoutPreset: 'generic',
        autoRunDecisioning: false, viewName: 'TUI Decisioning' },
      labCoreScript: 'tui-decisioning-demo.js?v=20261016-kirkham'
    };
    if (!window.AepGlobalSandbox.getSelected()) {
      window.AepGlobalSandbox.setSelected('kirkham', { source: 'tui-demo-default' });
    }
  </script>
  <script src="decisioning-persona-journey.js?v=20261016"></script>
  <script src="shared/env-bar.js?v=20261014-shared-env-parity"></script>
  <script src="aep-lab-nav.js?v=20261016-tui"></script>
  <script src="aep-theme.js" defer></script>
</body>
</html>
