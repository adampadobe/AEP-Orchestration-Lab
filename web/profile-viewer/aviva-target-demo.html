<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;if(localStorage.getItem('aepTheme')==='dark')d.setAttribute('data-aep-theme','dark');else d.removeAttribute('data-aep-theme');if(localStorage.getItem('aepSidebarCollapsed')==='1')d.setAttribute('data-sidebar-collapsed','');else d.removeAttribute('data-sidebar-collapsed');var mp=localStorage.getItem('aepMenuPalette');if(mp&&mp!=='default')d.setAttribute('data-aep-menu-palette',mp);else d.removeAttribute('data-aep-menu-palette');var bp=localStorage.getItem('aepBgPreset');if(bp&&bp!=='default')d.setAttribute('data-aep-bg-preset',bp);else d.removeAttribute('data-aep-bg-preset');var st=localStorage.getItem('aepHomeDashboardSidebarTheme');if(st==='light')d.setAttribute('data-ajo-sidebar','light');else d.setAttribute('data-ajo-sidebar','dark');}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="aviva-target-demo-page home-dashboard-concierge">
  <div class="aviva-target-demo-top-anchor" id="avivaTargetDemoTopAnchor">
    <section class="aviva-target-demo-id-banner" aria-label="Aviva Target demo controls">
            <div class="aviva-target-demo-id-inner aep-demo-id-inner"
        data-demo-env-strip-mount="site-clone-shell"
        data-demo-env-strip-variant="spectrum"
        data-demo-env-strip-title="Aviva Target (web)"
        data-demo-env-strip-subtitle="Active Configuration"
        data-demo-env-strip-bc-bottom="1"
        data-demo-env-strip-prefix="avivaTarget"
        data-demo-env-strip-selected-script-id="avivaTargetSelectedScript"
        data-demo-env-strip-script-preview-class="aviva-target-demo-script-preview"
        data-demo-env-strip-message-id="avivaTargetMessage"
        data-demo-env-strip-profile-btn-label="Look up profile"
        data-demo-env-strip-disclaimer="Embedded Aviva car insurance journey for Adobe Target A/B demos. Inject your Demo EMEA Launch property on this page, then click through — each step navigates to its own URL under <code>demos/aviva-target/</code> (motor quote paths match Aviva production). See <a href=&quot;https://github.com/adampadobe/AEP-Orchestration-Lab/blob/main/docs/AVIVA_TARGET_AB_TESTING.md&quot;>docs/AVIVA_TARGET_AB_TESTING.md</a>. Not affiliated with Aviva."></div>

    </section>
  </div>

  <iframe
    id="avivaTargetFrame"
    class="aviva-target-demo-site-frame"
    title="Aviva car insurance journey (Target demo)"
    src="demos/aviva-target/index.html"
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" aria-label="Primary"></aside>
    <div class="dashboard-main-wrap">
      <main class="dashboard-main app-page aviva-target-demo-empty-main" aria-hidden="true"></main>
    </div>
  </div>

  <script src="shared/env-bar.js?v=20260615-decisioning-reboot"></script>
