<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile simulator (FNB) — moved</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css?v=20260514-customer-demos-nav">
  <link rel="stylesheet" href="aep-theme.css?v=20260423b-fs-helper">
  <script>
    (function () {
      var target = 'fnb-demo.html?aepSimMobile=1';
      var map = {
        'fnb-phone': target,
        'fnb-ipad': target,
      };
      var h = (location.hash || '').replace(/^#/, '').trim();
      if (h && map[h]) {
        try {
          location.replace(map[h]);
        } catch (e) {
          location.href = map[h];
        }
      }
    })();
  </script>
</head>
<body class="home-dashboard-concierge">
  <main style="max-width: 36rem; margin: 2.5rem auto; padding: 0 1.25rem; color: var(--dash-text); font-family: Inter, system-ui, sans-serif;">
    <h1 style="font-size: 1.35rem; margin: 0 0 0.75rem;">FNB mobile simulator retired</h1>
    <p style="margin: 0 0 1rem; color: var(--dash-text-secondary); line-height: 1.5;">
      FNB does not have a dedicated mobile demo page yet. Use the web journey in mobile preview mode instead:
    </p>
    <p style="margin: 0 0 1.25rem;">
      <a href="fnb-demo.html?aepSimMobile=1">FNB journey (mobile sim)</a>
    </p>
    <p style="margin: 0;"><a href="home.html">← Home</a></p>
  </main>
</body>
</html>
