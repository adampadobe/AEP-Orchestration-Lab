<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;if(localStorage.getItem('aepTheme')==='dark')d.setAttribute('data-aep-theme','dark');else d.removeAttribute('data-aep-theme');if(localStorage.getItem('aepSidebarCollapsed')==='1')d.setAttribute('data-sidebar-collapsed','');else d.removeAttribute('data-sidebar-collapsed');var mp=localStorage.getItem('aepMenuPalette');if(mp&&mp!=='default')d.setAttribute('data-aep-menu-palette',mp);else d.removeAttribute('data-aep-menu-palette');var bp=localStorage.getItem('aepBgPreset');if(bp&&bp!=='default')d.setAttribute('data-aep-bg-preset',bp);else d.removeAttribute('data-aep-bg-preset');var st=localStorage.getItem('aepHomeDashboardSidebarTheme');if(st==='light')d.setAttribute('data-ajo-sidebar','light');else d.setAttribute('data-ajo-sidebar','dark');}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigator Global (demo) – AEP Profile Viewer</title>
  <!-- AEP Event Generator contract + replication: navigator-global-demo-assets/AEP-EVENT-REPLICATION.md -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css?v=20260514-customer-demos-nav">
  <link rel="stylesheet" href="mod-demo.css?v=20260521-stacked-layout">
  <link rel="stylesheet" href="aep-demo-env-bar.css?v=20260521-stacked-layout">
  <link rel="stylesheet" href="brand-concierge-controls.css?v=20260520-bc-controls">
  <link rel="stylesheet" href="aep-profile-drawer.css?v=20260521-refresh-btn-lightfix">
  <link rel="stylesheet" href="shared/profile-viewer-modal.css?v=20260601-modal-central">
  <link rel="stylesheet" href="aep-theme.css?v=20260423b-fs-helper">
  <link rel="stylesheet" href="aep-theme-palettes.css?v=20260416c">
</head>
<body class="mod-demo-page navigator-global-demo-page home-dashboard-concierge aep-bc-panel-dismissed">
  <!-- Lab identity strip: hover top edge to reveal (same pattern as British Army demo) -->
  <div class="mod-demo-top-anchor" id="modDemoTopAnchor">
    <div class="mod-demo-id-banner" role="region" aria-label="Customer identity">
      <div class="mod-demo-id-inner">
        <section class="aep-demo-env-section" id="aepDemoEnvSection" aria-label="AEP environment">
          <div class="aep-demo-env-editor" id="aepDemoEnvEditor">
            <div id="aepDemoEnvConfigGrid" class="aep-demo-env-collapsible">
              <span class="aep-demo-env-kicker">Environment</span>
              <div class="aep-demo-env-editor-grid">
                <div class="form-row">
                  <label for="sandboxSelect">Sandbox</label>
                  <select id="sandboxSelect" class="sandbox-select" aria-label="Select AEP sandbox">
                    <option value="">Loading sandboxes…</option>
                  </select>
                </div>
                <div class="mod-sdk-config-fields" id="navigatorSdkConfigFields">
                  <div class="form-row">
                    <label for="navigatorTagsCompany">Tags company</label>
                    <select id="navigatorTagsCompany" aria-label="Tags company"></select>
                  </div>
                  <div class="form-row">
                    <label for="navigatorTagsProperty">Tags property</label>
                    <input
                      id="navigatorTagsProperty"
                      type="text"
                      list="navigatorTagsPropertyList"
                      placeholder="Type to filter properties"
                      autocomplete="off"
                    >
                    <datalist id="navigatorTagsPropertyList"></datalist>
                  </div>
                  <div class="form-row">
                    <label for="navigatorTagsEnvironment">Tags environment</label>
                    <select id="navigatorTagsEnvironment" aria-label="Tags environment"></select>
                  </div>
                  <div class="mod-demo-id-actions">
                    <button type="button" id="navigatorInjectSdkBtn" class="btn-lookup">Inject selected script</button>
                  </div>
                  <div class="form-row aep-bc-toggle-row" role="group" aria-label="Brand Concierge">
                    <label class="aep-demo-web-push-label">
                      <input type="checkbox" id="navigatorBcOnInjectToggle" />
                      <span>Enable Brand Concierge when injecting Tags</span>
                    </label>
                    <select id="navigatorBcStyleSelect" class="aep-bc-style-select" aria-label="Brand Concierge style">
                      <option value="miral">Miral</option>
                      <option value="generic">Generic (DemoEfficiency)</option>
                      <option value="army">Army Recruitment</option>
                    </select>
                  </div>
                  <div class="form-row aep-bc-launcher-row" role="group" aria-label="BC launcher visibility">
                    <label class="aep-demo-web-push-label">
                      <input type="checkbox" id="navigatorBcLauncherToggle" />
                      <span>Show Brand Concierge launcher on page</span>
                    </label>
                  </div>
                </div>
                <div class="form-row">
                  <label for="generatorTarget">Event destination</label>
                  <select id="generatorTarget" aria-label="Edge or DCS streaming target"></select>
                </div>
              </div>
              <div class="mod-sdk-summary mod-sdk-summary--below-env-grid" id="navigatorSdkConfigSummary" hidden>
                <span id="navigatorSdkConfigSummaryText"></span>
                <button type="button" id="navigatorChangeSdkConfigBtn" class="btn-lookup">Change SDK config</button>
              </div>
            </div>
          <div class="aep-demo-env-compact" id="aepDemoEnvCompact" hidden>
            <span class="aep-demo-env-compact-text" id="aepDemoEnvCompactText"></span>
            <button type="button" id="aepDemoEnvExpandBtn" class="btn-lookup aep-demo-env-expand-btn">Change environment</button>
          </div>
          </div>
        </section>
        <section class="aep-demo-profile-section" id="aepDemoProfileSection" aria-label="Profile lookup">
          <span class="aep-demo-env-kicker">Profile lookup</span>
          <div class="aep-demo-profile-section-grid">
            <div class="form-row">
              <label for="modNs">Namespace</label>
              <select id="modNs" class="sandbox-select" aria-label="Identity namespace">
                <option value="email">Email</option>
                <option value="ecid">ECID</option>
                <option value="crmId">CRM ID</option>
                <option value="loyaltyId">Loyalty ID</option>
                <option value="phone">Phone</option>
              </select>
            </div>
            <div class="form-row">
              <label for="customerEmail">Identifier value</label>
              <input type="text" id="customerEmail" placeholder="Enter identifier" autocomplete="off" spellcheck="false">
            </div>
            <div class="mod-demo-id-actions">
              <button type="button" id="queryProfileBtn" class="btn-lookup">Look up profile</button>
              <span class="mod-demo-ecid-hint" id="ecidHint" aria-live="polite">ECID: <strong id="infoEcid">—</strong></span>
            </div>
          </div>
        </section>
      </div>
      <p class="mod-demo-script-preview">Selected script: <code id="navigatorSelectedScript">None</code></p>
      <p id="modMessage" class="mod-demo-message" role="status" aria-live="polite" hidden></p>
      <p class="mod-demo-disclaimer">
        Embedded snapshot (saved HTML + asset folder from browser export). Imagery may load from Navigator Global / Scene7 CDNs where the save did not include local copies. Not affiliated with Navigator Global or Santander UK.
      </p>
      <div class="navigator-demo-flow" role="group" aria-label="Demo-only signals for sector, membership, and webinar">
        <span class="navigator-demo-flow-label">Demo flow</span>
        <button type="button" class="navigator-demo-flow-btn" data-ng-demo-event="sector-alcohol">Alcohol sector page</button>
        <button type="button" class="navigator-demo-flow-btn" data-ng-demo-event="sector-nonalcohol">Non-alcohol sector page</button>
        <span class="navigator-demo-flow-sep" aria-hidden="true"></span>
        <button type="button" class="navigator-demo-flow-btn" data-ng-demo-event="membership-free">Free membership</button>
        <button type="button" class="navigator-demo-flow-btn" data-ng-demo-event="membership-paid">Paid membership</button>
        <button type="button" class="navigator-demo-flow-btn" data-ng-demo-event="webinar-joined">Webinar joined</button>
      </div>
    </div>
  </div>

  <iframe
    id="navigatorDemoSiteFrame"
    class="mod-demo-site-frame"
    title="Navigator Global UK — saved page snapshot (embedded)"
    src="navigator-global-demo-assets/navigator-global-snapshot.html"
    referrerpolicy="no-referrer-when-downgrade"
    loading="eager"
  ></iframe>

  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" aria-label="Primary"></aside>
    <div class="dashboard-main-wrap">
      <main class="dashboard-main app-page mod-demo-empty-main" aria-hidden="true"></main>
    </div>
  </div>

  <div id="profileViewerModalMount" data-aep-profile-viewer-modal-mount="1"></div>

  <script src="firebase-database-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="aep-global-sandbox.js"></script>
  <script src="aep-lab-sandbox-sync.js?v=20260420-theme-per-sandbox"></script>
  <script src="email-cache.js"></script>
  <script src="identity-picker.js"></script>
  <script src="email-engagement-metrics.js"></script>
  <script src="shared/profile-viewer-modal.js?v=20260601-modal-central"></script>
  <script src="aep-profile-drawer.js?v=20260521-ns-autodetect"></script>
  <script src="demo-tags-injection.js?v=20260521-demo-tags"></script>
  <script src="aep-demo-env-bar.js?v=20260508-demo-env-strip"></script>
  <script src="aep-demo-generator-targets.js?v=20260508"></script>
  <script src="navigator-global-demo.js?v=20260513-drawer-mirror"></script>
  <script defer src="aep-theme.js?v=20260421-fs-helper"></script>
  <script defer src="aep-theme-prefs.js?v=20260416d"></script>
  <script defer src="aep-lab-nav.js?v=20260520-miral-pages-removed"></script>

  <script src="styleConfigurations.js?v=bc-4-hide-ai-chat-icon"></script>
  <script src="brand-concierge-styles-bundle.js?v=20260520-bc-bundle"></script>
  <script src="brand-concierge-toggle.js?v=20260521-bc-reopen-v2"></script>

  <style>
    .bc-card__image {
      background-size: contain !important;
      background-repeat: no-repeat !important;
    }

    #brand-concierge-mount-host {
      width: min(420px, calc(100vw - 32px));
      max-height: min(720px, calc(100vh - 32px));
      pointer-events: auto;
      background: transparent;
    }

    html[data-aep-theme="dark"] #brand-concierge-mount-host {
      color-scheme: dark;
    }
  </style>

  <button type="button" id="aepBcReopenBtn" class="aep-bc-reopen-btn" hidden aria-label="Open Brand Concierge">
    <img src="assets/brand-concierge-launch.png" alt="" width="48" height="48" decoding="async" />
  </button>

  <div id="brand-concierge-mount-host" aria-live="polite">
    <button type="button" id="aepBcDismissBtn" class="aep-bc-dismiss-btn" aria-label="Close Brand Concierge">
      ×
    </button>
    <div id="brand-concierge-mount"></div>
  </div>
  <button type="button" id="navigatorBcLauncher" class="aep-bc-park-launcher" aria-label="Open Brand Concierge">
    <svg width="16" height="16" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <path d="M22 6l1.2 4.4L28 12l-4.8 1.4L22 18l-1.2-4.6L16 12l4.8-1.6L22 6z" fill="currentColor"/>
      <path d="M10 26l0.6 2 2 0.6-2 0.6L10 31l-0.6-2-2-0.6 2-0.6 0.6-2z" fill="currentColor" opacity=".6"/>
    </svg>
    Ask
  </button>
  <script src="brand-concierge-controls.js?v=20260520-bc-controls"></script>
</body>
</html>
