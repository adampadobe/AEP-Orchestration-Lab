<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;if(localStorage.getItem('aepTheme')==='dark')d.setAttribute('data-aep-theme','dark');else d.removeAttribute('data-aep-theme');if(localStorage.getItem('aepSidebarCollapsed')==='1')d.setAttribute('data-sidebar-collapsed','');else d.removeAttribute('data-sidebar-collapsed');var mp=localStorage.getItem('aepMenuPalette');if(mp&&mp!=='default')d.setAttribute('data-aep-menu-palette',mp);else d.removeAttribute('data-aep-menu-palette');var bp=localStorage.getItem('aepBgPreset');if(bp&&bp!=='default')d.setAttribute('data-aep-bg-preset',bp);else d.removeAttribute('data-aep-bg-preset');var st=localStorage.getItem('aepHomeDashboardSidebarTheme');if(st==='light')d.setAttribute('data-ajo-sidebar','light');else d.setAttribute('data-ajo-sidebar','dark');}catch(e){}})();</script>

  <title>Home – AEP Profile Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css?v=20260519a">

  <link rel="stylesheet" href="home-new.css?v=20260624c">

</head>
<body class="home-page home-dashboard-concierge home-dashboard-ajo home-new-page" data-aep-theme="dark">
  <div class="dashboard-shell" id="aepDashboardShell">
    <div id="aepDashboardMount" class="aep-dashboard-mount aep-dashboard-mount--pending" aria-live="polite">
      <p class="aep-dashboard-mount-placeholder dashboard-muted">Loading…</p>
    </div>
  </div>

  <template id="aepDeferredDashboardShell">
    <aside class="dashboard-sidebar" aria-label="Primary"></aside>

    <div class="dashboard-main-wrap dashboard-main-wrap--layout">
      <header class="dashboard-topbar">
        <h1 class="dashboard-topbar-title">AEP Profile Viewer</h1>
        <div class="dashboard-topbar-right">
          <span class="dashboard-env-pill" title="Spectrum home pilot">Home</span>
          <a href="https://experienceleague.adobe.com/docs/experience-platform/profile/home.html" class="dashboard-topbar-link" target="_blank" rel="noopener">Documentation</a>
        </div>
      </header>

      <main class="dashboard-main">
        <section class="home-greeting-bar" id="homeGreetingBar" aria-label="Welcome">
          <div class="home-greeting-bar__main">
            <h2 class="home-greeting-bar__title">Hello <span id="homeGreetingName">there</span></h2>
            <p class="home-greeting-bar__subtitle">AEP Orchestration Lab — your profile workspace</p>
          </div>
          <div class="home-greeting-bar__stats">
            <div class="home-greeting-stat">
              <span class="home-greeting-stat__label">Sandbox</span>
              <span class="home-greeting-stat__value" id="homeGreetingSandbox">—</span>
            </div>
            <div class="home-greeting-stat home-greeting-stat--stock">
              <span class="home-greeting-stat__label">Adobe stock</span>
              <span class="home-greeting-stat__value" id="homeGreetingStock">ADBE — loading…</span>
            </div>
          </div>
        </section>

        <section class="home-release-panel" id="homeReleasePanel" aria-labelledby="homeReleaseHeading">
          <header class="home-release-panel__head">
            <div>
              <p class="home-release-panel__eyebrow">Adobe Experience Cloud · <span id="homeReleasePeriod">June 2026</span></p>
              <h3 class="home-release-panel__title" id="homeReleaseHeading">
                Experience Cloud — <span class="home-release-panel__title-accent">Latest releases</span>
              </h3>
              <p class="home-release-panel__meta">
                CDP · AJO-J · AJO-C · Decisioning · AJO · CJA · Campaign v8 Web UI · Concierge · Visibility · Target
              </p>
            </div>
            <div class="home-release-panel__actions">
              <label class="home-release-period-select-wrap">
                <span class="home-release-period-select-label">Release</span>
                <select id="homeReleasePeriodSelect" class="home-release-period-select" aria-label="Release period"></select>
              </label>
              <span class="home-release-timestamp" id="homeReleaseTimestamp"></span>
              <button type="button" class="home-release-sp-btn home-release-sp-btn--secondary" id="homeReleaseRefresh" title="Refresh from Experience League">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5"/><path d="M13.5 2.5v3h-3"/></svg>
                Refresh
              </button>
              <a class="home-release-sp-btn home-release-sp-btn--quiet" href="https://experienceleague.adobe.com/en/docs/release-notes/experience-cloud/current" target="_blank" rel="noopener">Experience League</a>
              <button type="button" class="home-release-sp-btn home-release-sp-btn--accent" id="homeReleaseExpand">View all</button>
            </div>
          </header>

          <div class="home-release-inline-alert" id="homeReleaseAlert" hidden role="alert"></div>

          <div class="home-release-sp-tabs" id="homeReleaseTabs" role="tablist" aria-label="Product release notes"></div>

          <div class="home-release-panel__body" id="homeReleasePanelBody">
            <div class="home-release-card-grid" id="homeReleaseGrid" aria-live="polite"></div>
          </div>

          <footer class="home-release-panel__foot">
            <span id="homeReleaseFootNote">Loading highlights…</span>
            <button type="button" class="home-release-sp-btn home-release-sp-btn--quiet" id="homeReleaseExpandFoot">Expand in drawer →</button>
          </footer>
        </section>

        <section class="dashboard-panel" id="aepAccessModePanel" aria-labelledby="aepAccessModeHeading">
          <div class="dashboard-panel-head">
            <h3 class="dashboard-panel-title" id="aepAccessModeHeading">Access mode</h3>
            <span id="aepAccessModeSummary" class="dashboard-muted">Detecting mode…</span>
          </div>
          <p class="dashboard-panel-text">First-time visitors open <strong>Configure access mode</strong> and use <strong>Create account</strong> with your <strong>@adobe.com</strong> email and password; an administrator is notified immediately and must approve the account before you can sign in and choose <strong>Adobe sandbox</strong> vs <strong>no Adobe sandbox</strong>. Returning visitors use <strong>Login</strong> in that dialog, the quick switch, or reopen setup anytime.</p>
          <div id="aepAccessModeToggleWrap" class="aep-access-mode-toggle-wrap" hidden>
            <p class="aep-access-mode-toggle-hint">Quick switch — same Adobe lab account; confirm when changing paths.</p>
            <div class="aep-access-mode-toggle-row" role="group" aria-label="Lab access mode">
              <button type="button" class="dashboard-btn-outline" id="aepAccessToggleSandbox" aria-pressed="false">Adobe sandbox</button>
              <button type="button" class="dashboard-btn-outline" id="aepAccessToggleWorkspace" aria-pressed="false">No Adobe sandbox</button>
            </div>
          </div>
          <div class="aep-access-mode-actions-row">
            <button type="button" class="dashboard-btn-outline" id="aepAccessModeOpenBtn">Configure access mode</button>
            <span id="aepAccessModeStatus" class="dashboard-muted" aria-live="polite"></span>
          </div>
        </section>

        <section class="home-lab-updates" id="homeLabUpdates" aria-labelledby="homeLabUpdatesHeading">
          <header class="home-lab-updates__head">
            <h3 class="home-lab-updates__title" id="homeLabUpdatesHeading">Latest in the lab</h3>
            <p class="home-lab-updates__subtitle">Recent demo pages and brand scrapes for your sandbox</p>
          </header>
          <div class="home-lab-updates__grid">
            <div class="home-lab-updates__col">
              <h4 class="home-lab-updates__col-title">Demo pages</h4>
              <div class="home-lab-updates__list" id="homeLabDemosList"></div>
            </div>
            <div class="home-lab-updates__col">
              <h4 class="home-lab-updates__col-title">Recent scrapes</h4>
              <div class="home-lab-updates__list" id="homeLabScrapesList">
                <p class="home-lab-updates-loading" role="status">Loading…</p>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </template>

  <div class="home-release-drawer-backdrop" id="homeReleaseBackdrop" hidden></div>
  <aside class="home-release-drawer" id="homeReleaseDrawer" aria-hidden="true" aria-labelledby="homeReleaseDrawerTitle">
    <header class="home-release-drawer__head">
      <div>
        <h2 class="home-release-drawer__title" id="homeReleaseDrawerTitle">Product releases</h2>
        <p class="home-release-drawer__desc" id="homeReleaseDrawerDesc">Experience League</p>
      </div>
      <button type="button" class="home-release-drawer__close" id="homeReleaseDrawerClose" aria-label="Close">×</button>
    </header>
    <div class="home-release-drawer__sections" id="homeReleaseDrawerSections"></div>
  </aside>

  <script src="firebase-database-config.js?v=20260527"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="aep-lab-sandbox-sync.js?v=20260520c"></script>
  <script src="aep-access-onboarding.js?v=20260527b"></script>
  <script>
    (function () {
      if (!window.AepAccessScope) return;
      if (window.AepAccessOnboarding && typeof window.AepAccessOnboarding.init === 'function') {
        window.AepAccessOnboarding.init();
      }
      function initHomeAccessModePanel() {
        var openBtn = document.getElementById('aepAccessModeOpenBtn');
        var statusEl = document.getElementById('aepAccessModeStatus');
        var summaryEl = document.getElementById('aepAccessModeSummary');
        var toggleWrap = document.getElementById('aepAccessModeToggleWrap');
        var btnSandbox = document.getElementById('aepAccessToggleSandbox');
        var btnWorkspace = document.getElementById('aepAccessToggleWorkspace');
        if (!summaryEl || !statusEl) return;

        function syncToggleUi() {
          if (!toggleWrap || !btnSandbox || !btnWorkspace) return;
          var hasMode = window.AepAccessScope.hasExplicitMode();
          toggleWrap.hidden = !hasMode;
          if (!hasMode) return;
          var mode = window.AepAccessScope.getAccessMode();
          var isSandbox = mode === 'sandbox';
          btnSandbox.setAttribute('class', isSandbox ? 'dashboard-btn-primary' : 'dashboard-btn-outline');
          btnWorkspace.setAttribute('class', !isSandbox ? 'dashboard-btn-primary' : 'dashboard-btn-outline');
          btnSandbox.setAttribute('aria-pressed', isSandbox ? 'true' : 'false');
          btnWorkspace.setAttribute('aria-pressed', !isSandbox ? 'true' : 'false');
        }

        function trySwitchAccessMode(target) {
          var cur = window.AepAccessScope.getAccessMode();
          if (cur === target) return;
          var msg =
            target === 'sandbox'
              ? 'Switch to Adobe sandbox? No-sandbox tools stay idle until you switch back. Your saved workspace keys are kept.'
              : 'Switch to no Adobe sandbox? Sandbox-backed tools will follow workspace scope until you switch again.';
          if (!window.confirm(msg)) return;
          if (target === 'sandbox') {
            window.AepAccessScope.setAccessMode('sandbox');
            return;
          }
          var slug = window.AepAccessScope.getWorkspaceSlug();
          if (!slug) {
            try { window.__aepOnboardingPreferWorkspace = true; } catch (_e) {}
            if (window.AepAccessOnboarding && typeof window.AepAccessOnboarding.open === 'function') {
              window.AepAccessOnboarding.open();
            }
            return;
          }
          window.AepAccessScope.setAccessMode('workspace');
        }

        function syncUi() {
          var scope = window.AepAccessScope.getScope();
          summaryEl.textContent = scope.mode === 'workspace'
            ? ('No-sandbox workspace: ' + (scope.workspaceName || scope.scopeId || 'not configured'))
            : 'Adobe sandbox mode';
          syncToggleUi();
        }
        function refreshAccessStatusHint() {
          if (!window.AepAccessScope.hasExplicitMode()) {
            statusEl.textContent = 'Choose your access mode to continue.';
          } else if (
            window.AepAccessOnboarding &&
            typeof window.AepAccessOnboarding.hasAdobeLabFirebaseSession === 'function' &&
            !window.AepAccessOnboarding.hasAdobeLabFirebaseSession()
          ) {
            statusEl.textContent = 'Sign in with Adobe @adobe.com (Login in Configure access mode).';
          } else {
            statusEl.textContent = '';
          }
        }
        if (btnSandbox) btnSandbox.addEventListener('click', function () { trySwitchAccessMode('sandbox'); });
        if (btnWorkspace) btnWorkspace.addEventListener('click', function () { trySwitchAccessMode('workspace'); });
        if (openBtn) {
          openBtn.addEventListener('click', function () {
            if (window.AepAccessOnboarding && typeof window.AepAccessOnboarding.open === 'function') {
              window.AepAccessOnboarding.open();
              statusEl.textContent = '';
            }
          });
        }
        window.addEventListener('aep-access-scope-change', function () {
          syncUi();
          refreshAccessStatusHint();
        });
        window.addEventListener('aep-lab-email-session-updated', refreshAccessStatusHint);
        window.addEventListener('aep-lab-google-session-updated', refreshAccessStatusHint);
        syncUi();
        refreshAccessStatusHint();
      }
      window.addEventListener('aep-deferred-dashboard-mounted', initHomeAccessModePanel, { once: true });
    })();
  </script>
