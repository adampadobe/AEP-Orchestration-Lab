<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;if(localStorage.getItem('aepTheme')==='dark')d.setAttribute('data-aep-theme','dark');else d.removeAttribute('data-aep-theme');if(localStorage.getItem('aepSidebarCollapsed')==='1')d.setAttribute('data-sidebar-collapsed','');else d.removeAttribute('data-sidebar-collapsed');}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QIA orchestration plan (demo) – AEP Profile Viewer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css?v=20260514-customer-demos-nav">

    window.SiteCloneBcPage = {
      iframeId: 'qiaSiteFrame',

  </script>

<body class="qia-demo-page home-dashboard-concierge">
  <div class="qia-demo-top-anchor" id="qiaDemoTopAnchor">
    <section class="qia-demo-id-banner" aria-label="QIA demo identity controls">
      <div class="qia-demo-id-inner aep-demo-id-inner"
        data-demo-env-strip-mount="site-clone-shell"
        data-demo-env-strip-variant="spectrum"
        data-demo-env-strip-title="QIA orchestration plan (web)"
        data-demo-env-strip-subtitle="Active Configuration"
        data-demo-env-strip-bc-bottom="1"
        data-demo-env-strip-decisioning="1"
        data-demo-env-strip-prefix="qia"
        data-demo-env-strip-selected-script-id="qiaSelectedScript"
        data-demo-env-strip-script-preview-class="qia-demo-script-preview"
        data-demo-env-strip-message-id="qiaMessage"
        data-demo-env-strip-profile-btn-label="Look up profile"
        data-demo-env-strip-disclaimer="Fictional customer demo for Adobe solution planning. Not affiliated with or endorsed by Qatar Investment Authority."></div>
    </section>
  </div>

  <div id="siteCloneBcFrameHost" class="site-clone-bc-frame-host" hidden>
    <div id="siteCloneBcFrameMount" class="site-clone-bc-frame-mount"></div>
  </div>
  <button type="button" id="siteCloneBcFab" class="aep-bc-reopen-btn site-clone-bc-fab" hidden aria-label="Open Brand Concierge" aria-expanded="false" aria-controls="aepBcModal">
    <img src="https://contenthosting.web.app/logos/adobe_icon_146235.webp" alt="" width="48" height="48" decoding="async">
  </button>
  <div id="aepBcModal" class="aep-bc-modal" role="dialog" aria-modal="true" aria-labelledby="aepBcModalTitle" hidden>
    <button type="button" class="aep-bc-modal__backdrop" data-aep-bc-close aria-label="Close dialog"></button>
    <div class="aep-bc-modal__dialog">
      <button type="button" class="aep-bc-modal__close" data-aep-bc-close aria-label="Close Brand Concierge">&times;</button>
      <h2 id="aepBcModalTitle" class="visually-hidden">Brand Concierge</h2>
      <div id="brand-concierge-mount" class="aep-bc-modal__mount"></div>
    </div>
  </div>

  <iframe id="qiaSiteFrame" class="qia-demo-site-frame" title="QIA public website campaign demonstration" src="qia/qia-site.html?v=20260727-newsletter-flow" sandbox="allow-same-origin allow-scripts allow-forms allow-popups" loading="eager"></iframe>

  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" aria-label="Primary"></aside>
    <div class="dashboard-main-wrap"><main class="dashboard-main app-page qia-demo-empty-main" aria-hidden="true"></main></div>
  </div>
  <div id="profileViewerModalMount" data-aep-profile-viewer-modal-mount="1"></div>

  <script src="firebase-database-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="aep-global-sandbox.js"></script>
  <script src="aep-lab-sandbox-sync.js?v=20260514-id-token-health"></script>
  <script src="email-cache.js"></script>
  <script src="identity-picker.js"></script>
  <script src="email-engagement-metrics.js"></script>
  <script src="shared/profile-viewer-modal.js?v=20260601-modal-central"></script>
  <script src="aep-profile-drawer.js?v=20260521-ns-autodetect"></script>
  <script src="aep-demo-web-push.js?v=20260512-lab-push"></script>
  <script src="shared/env-bar.js?v=20260714-env-bar-config-fileconvert"></script>
  <script>
    window.envBarConfig = {
      prefix: 'qia',
      variant: 'spectrum',
      features: { webPush: true, bc: true, decisioning: true },
      decisioning: { iframeId: 'qiaSiteFrame', mountLayoutPreset: 'generic', viewName: 'QIA orchestration plan' },
    };
  </script>
  <script src="aep-demo-generator-targets.js?v=20260720-gen-target-fix"></script>
  <script src="brand-concierge-styles-bundle.js?v=20260520-bc-bundle"></script>
  <script src="brand-concierge-toggle.js?v=20260526-bc-prefs-flush"></script>
  <script>
    window.SiteCloneDemoEnv = {
      storagePrefix: 'qiaDemo',
      webPushBySandboxKey: 'qiaDemoWebPushOnInjectBySandbox',
      webPushLegacyKey: 'qiaDemoWebPushOnInjectToggle',
      webPushToggleId: 'qiaWebPushOnInjectToggle',
      bcOnInjectToggleId: 'qiaBcOnInjectToggle',
      bcStyleSelectId: 'qiaBcStyleSelect',
    };
  </script>
  <script src="qia-demo.js?v=20260727-launch"></script>
  <script src="site-clone-bc.js?v=20260614-modal-dock-parity"></script>

  </div>
  <script src="brand-concierge-controls.js?v=20260520-bc-controls"></script>

</html>
