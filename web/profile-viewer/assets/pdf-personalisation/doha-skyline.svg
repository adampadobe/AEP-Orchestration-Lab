<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Doha West Bay skyline illustration</title>
  <desc id="desc">An original stylised illustration of Doha's waterfront, with the rounded Doha Tower, curved Tornado Tower and stepped Palm Tower silhouettes at sunset. Not a photograph.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="rgb(27,46,79)"/>
      <stop offset=".65" stop-color="rgb(151,97,115)"/>
      <stop offset="1" stop-color="rgb(244,183,136)"/>
    </linearGradient>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="rgb(68,103,126)"/>
      <stop offset="1" stop-color="rgb(17,48,71)"/>
    </linearGradient>
    <pattern id="windows" width="18" height="24" patternUnits="userSpaceOnUse">
      <rect width="18" height="24" fill="rgb(33,53,73)"/>
      <rect x="6" y="5" width="4" height="10" fill="rgb(238,198,148)" opacity=".65"/>
    </pattern>
    <pattern id="lattice" width="24" height="36" patternUnits="userSpaceOnUse">
      <rect width="24" height="36" fill="rgb(98,89,91)"/>
      <path d="M0 0 24 36M24 0 0 36" stroke="rgb(239,203,159)" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1240" cy="350" r="76" fill="rgb(252,213,168)" opacity=".8"/>
  <path d="M0 610H1600V900H0Z" fill="url(#water)"/>
