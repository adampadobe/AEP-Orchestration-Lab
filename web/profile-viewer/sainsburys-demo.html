<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;if(localStorage.getItem('aepTheme')==='dark')d.setAttribute('data-aep-theme','dark');else d.removeAttribute('data-aep-theme');if(localStorage.getItem('aepSidebarCollapsed')==='1')d.setAttribute('data-sidebar-collapsed','');else d.removeAttribute('data-sidebar-collapsed');}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sainsbury's (web) – AEP Profile Viewer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css?v=20260514-customer-demos-nav">
  <link rel="stylesheet" href="mod-demo.css?v=20260526-bc-env-grid">
  <link rel="stylesheet" href="site-clone-bc.css?v=20260720d-armcom-scroll">
  <link rel="stylesheet" href="brand-concierge-controls.css?v=20260520-bc-controls">
  <link rel="stylesheet" href="aep-profile-drawer.css?v=20260721-armcom-ecid-reset">
  <link rel="stylesheet" href="shared/profile-viewer-modal.css?v=20260601-modal-central">
  <link rel="stylesheet" href="aep-theme.css?v=20260423b-fs-helper">
  <script>
    window.SiteCloneBcPage = {
      iframeId: 'sainsburysDemoSiteFrame',
      defaultFrameSrc: 'sainsburys-demo-assets/index.html',
      statusMessageId: 'sainsburysMessage',
    };
  </script>
</head>
<body class="mod-demo-page sainsburys-demo-page home-dashboard-concierge">
  <div class="mod-demo-top-anchor lab-env-top-anchor" id="sainsburysDemoTopAnchor">
    <div class="mod-demo-id-banner" role="region" aria-label="Customer identity">
      <div class="mod-demo-id-inner aep-demo-id-inner"
        data-demo-env-strip-mount="site-clone-shell"
        data-demo-env-strip-variant="spectrum"
        data-demo-env-strip-title="Sainsbury's (web)"
        data-demo-env-strip-subtitle="Active Configuration"
        data-demo-env-strip-prefix="sainsburys"
        data-demo-env-strip-selected-script-id="sainsburysSelectedScript"
        data-demo-env-strip-message-id="sainsburysMessage"
        data-demo-env-strip-profile-btn-label="Look up profile"
        data-demo-env-strip-bc-bottom="1"
        data-demo-env-strip-disclaimer="Sainsbury's retail experience mockup for the AEP Orchestration Lab, rebuilt from a supplied page capture with local static assets. Not affiliated with J Sainsbury plc."></div>
    </div>
  </div>

  <div id="siteCloneBcFrameHost" class="site-clone-bc-frame-host" hidden>
    <div id="siteCloneBcFrameMount" class="site-clone-bc-frame-mount"></div>
  </div>
  <button type="button" id="siteCloneBcFab" class="aep-bc-reopen-btn site-clone-bc-fab" hidden aria-label="Open Brand Concierge" aria-expanded="false" aria-controls="aepBcModal">
    <img src="https://contenthosting.web.app/logos/adobe_icon_146235.webp" alt="" width="48" height="48" decoding="async" />
  </button>
  <div id="aepBcModal" class="aep-bc-modal" role="dialog" aria-modal="true" aria-labelledby="aepBcModalTitle" hidden>
    <button type="button" class="aep-bc-modal__backdrop" data-aep-bc-close aria-label="Close dialog"></button>
    <div class="aep-bc-modal__dialog">
      <button type="button" class="aep-bc-modal__close" data-aep-bc-close aria-label="Close Brand Concierge">&times;</button>
      <h2 id="aepBcModalTitle" class="visually-hidden">Brand Concierge</h2>
      <div id="brand-concierge-mount" class="aep-bc-modal__mount"></div>
    </div>
  </div>

  <iframe
    id="sainsburysDemoSiteFrame"
    class="mod-demo-site-frame"
    title="Sainsbury's (web) — site snapshot (embedded)"
    src="sainsburys-demo-assets/index.html"
    referrerpolicy="no-referrer-when-downgrade"
    sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
    loading="eager"
  ></iframe>

  <!-- decisioning-mounts: paste shared/decisioning-mount-zones.fragment.html into iframe snapshot HTML -->
  <!-- #TopRibbon, #hero-banner (or data-hero-mount), #ContentCardContainer -->

  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" aria-label="Primary"></aside>
    <div class="dashboard-main-wrap">
      <main class="dashboard-main app-page mod-demo-empty-main" aria-hidden="true"></main>
    </div>
  </div>

  <div id="profileViewerModalMount" data-aep-profile-viewer-modal-mount="1"></div>

  <script src="firebase-database-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="aep-global-sandbox.js?v=20260614-inject-guard"></script>
  <script src="aep-lab-sandbox-sync.js?v=20260514-id-token-health"></script>
  <script src="email-cache.js"></script>
  <script src="identity-picker.js"></script>
  <script src="shared/profile-viewer-modal.js?v=20260721-armcom-ecid-reset"></script>
  <script src="aep-profile-drawer.js?v=20260721-linkedin-env-bar-fix"></script>
  <script src="aep-demo-web-push.js?v=20260512-lab-push"></script>
  <script>
    window.envBarConfig = {
      prefix: 'sainsburys',
      variant: 'spectrum',
      settingsButtonOnly: true,
      features: { webPush: true, bc: true, decisioning: true, },
      iframeIds: ['sainsburysDemoSiteFrame'],
      decisioning: {
        iframeId: 'sainsburysDemoSiteFrame',
        mountLayoutPreset: 'generic',
        viewName: 'Sainsbury\'s (web)',
      }
    };
  </script>
  <script src="shared/env-bar.js?v=20260903-settings-button-gated"></script>
  <script src="aep-demo-generator-targets.js?v=20260508"></script>
  <script src="brand-concierge-styles-bundle.js?v=20260520-bc-bundle"></script>
  <script src="brand-concierge-toggle.js?v=20260526-bc-prefs-flush"></script>
  <script>
    window.SiteCloneDemoEnv = {
      storagePrefix: 'sainsburysDemo',
      webPushBySandboxKey: 'sainsburysDemoWebPushOnInjectBySandbox',
      webPushLegacyKey: 'sainsburysDemoWebPushOnInjectToggle',
      webPushToggleId: 'sainsburysWebPushOnInjectToggle',
      bcOnInjectToggleId: 'sainsburysBcOnInjectToggle',
      bcStyleSelectId: 'sainsburysBcStyleSelect',
      fileSlug: 'sainsburys',
    };
  </script>
  <script src="site-clone-login-shell.js?v=20260701-site-clone-login"></script>
  <script src="brand-scraper-site-clone-lab-core.js?v=20260902-sainsburys-ajo-web"></script>
  <script src="site-clone-bc.js?v=20260720d-armcom-scroll"></script>
  <script defer src="aep-theme.js?v=20260421-fs-helper"></script>
  <script defer src="aep-theme-prefs.js?v=20260416d"></script>
  <script defer src="aep-lab-nav.js?v=20260720-social-presenter-bypass"></script>
  <div id="brand-concierge-mount-host" aria-live="polite" hidden>
    <button type="button" id="aepBcDismissBtn" class="aep-bc-dismiss-btn" aria-label="Close Brand Concierge">&times;</button>
  </div>
  <script src="brand-concierge-controls.js?v=20260520-bc-controls"></script>
</body>
</html>
