<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var d=document.documentElement;if(localStorage.getItem('aepTheme')==='dark')d.setAttribute('data-aep-theme','dark');else d.removeAttribute('data-aep-theme');if(localStorage.getItem('aepSidebarCollapsed')==='1')d.setAttribute('data-sidebar-collapsed','');else d.removeAttribute('data-sidebar-collapsed');var mp=localStorage.getItem('aepMenuPalette');if(mp&&mp!=='default')d.setAttribute('data-aep-menu-palette',mp);else d.removeAttribute('data-aep-menu-palette');var bp=localStorage.getItem('aepBgPreset');if(bp&&bp!=='default')d.setAttribute('data-aep-bg-preset',bp);else d.removeAttribute('data-aep-bg-preset');var st=localStorage.getItem('aepHomeDashboardSidebarTheme');if(st==='light')d.setAttribute('data-ajo-sidebar','light');else d.setAttribute('data-ajo-sidebar','dark');}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Demo – AEP Profile Viewer</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../home.css?v=20260603-llm-demo">
  <link rel="stylesheet" href="../../mod-demo.css?v=20260603-llm-demo">
  <link rel="stylesheet" href="../../sky-llm-optimizer.css?v=20260603-llm-demo">
  <link rel="stylesheet" href="llm-demo.css?v=20260614c">
  <link rel="stylesheet" href="../../aep-profile-drawer.css?v=20260521-refresh-btn-lightfix">
  <link rel="stylesheet" href="../../shared/profile-viewer-modal.css?v=20260603-modal-central">
  <link rel="stylesheet" href="../../aep-theme.css?v=20260423b-fs-helper">
  <link rel="stylesheet" href="../../aep-theme-palettes.css?v=20260416c">
</head>
<body class="mod-demo-page llm-demo-page home-dashboard-concierge">
  <iframe
    id="llmDemoFrame"
    class="mod-demo-site-frame sky-llm-optimizer-frame"
    title="Adobe LLM Optimizer — LLM Demo"
    src="../../sky-llm-snapshot/overview.html?v=20260706&llmDemo=1"
    referrerpolicy="no-referrer-when-downgrade"
    sandbox="allow-same-origin allow-scripts allow-forms"
    loading="eager"
  ></iframe>

  <div class="llm-demo-customize-anchor" id="llmDemoCustomizeAnchor">
    <div class="llm-demo-customize-panel" id="llmDemoCustomizePanel" aria-hidden="true" role="region" aria-labelledby="llmDemoCustomizeTitle">
      <div class="llm-demo-customize-inner">
        <h2 id="llmDemoCustomizeTitle">Personalize for customer</h2>
        <p class="llm-demo-customize-hint">
          Sandbox is set globally (Global values or lab nav). Move the mouse to the <strong>bottom edge</strong> to personalize from a brand scrape or customer URL — the lab crawls the site and rewrites copy and URLs across Overview, Opportunities, Brand Presence, and related pages.
        </p>
        <div class="llm-demo-customize-row">
          <label for="llmDemoScrapeSelect">Saved brand scrape (sandbox)
            <select id="llmDemoScrapeSelect" class="sandbox-select" aria-label="Saved brand scrapes for current sandbox">
              <option value="">Loading scrapes…</option>
            </select>
          </label>
        </div>
        <div class="llm-demo-customize-row">
          <label for="llmDemoSiteUrl">Customer site URL
            <input type="url" id="llmDemoSiteUrl" placeholder="https://www.example.com" autocomplete="off" spellcheck="false">
          </label>
          <label for="llmDemoBrand">Brand name (optional override)
            <input type="text" id="llmDemoBrand" placeholder="Auto from domain" autocomplete="off" spellcheck="false">
          </label>
        </div>
        <div class="llm-demo-customize-actions">
          <button type="button" id="llmDemoLoadScrapeBtn" class="btn-lookup">Load scrape</button>
          <button type="button" id="llmDemoApplyBtn" class="btn-lookup">Research &amp; apply</button>
          <button type="button" id="llmDemoResetBtn" class="btn-lookup">Reset to Sky demo</button>
          <span class="llm-demo-customize-status" id="llmDemoCustomizeStatus" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="mod-demo-sidebar-hover-zone" aria-hidden="true"></div>
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" aria-label="Primary"></aside>
    <div class="dashboard-main-wrap">
      <main class="dashboard-main mod-demo-empty-main" aria-hidden="true"></main>
    </div>
  </div>

  <div id="profileViewerModalMount" data-aep-profile-viewer-modal-mount="1"></div>

  <!-- Env bar bootstrap only (global sandbox via AepGlobalSandbox — no top strip) -->
  <div class="llm-demo-env-bootstrap visually-hidden" aria-hidden="true">
    <div
      class="aep-demo-id-inner"
      data-demo-env-strip-mount="site-clone-minimal"
      data-demo-env-strip-prefix="llmDemo"
      data-demo-env-strip-ns-id="llmDemoNs"
      data-demo-env-strip-message-id="llmDemoMessage"
      data-demo-env-strip-hide-generator-target="1"
    ></div>
    <p id="llmDemoMessage" class="mod-demo-message" role="status" aria-live="polite" hidden></p>
  </div>

  <script src="../../firebase-database-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="../../aep-global-sandbox.js"></script>
  <script src="../../aep-lab-sandbox-sync.js?v=20260514-id-token-health"></script>
  <script src="../../email-cache.js"></script>
  <script src="../../identity-picker.js"></script>
  <script src="../../shared/profile-viewer-modal.js?v=20260603-modal-central"></script>
  <script src="../../aep-profile-drawer.js?v=20260521-ns-autodetect"></script>
  <script src="../../shared/env-bar.js?v=20260615-decisioning-reboot"></script>
  <script>
    window.envBarConfig = {
      prefix: 'llmDemo',
      mode: 'minimal',
      variant: 'classic',
      basePath: '../../',
      features: { webPush: false, bc: false, decisioning: false },
    };
  </script>
  <script src="../../aep-demo-generator-targets.js?v=20260508"></script>
  <script src="llm-demo-config.js?v=20260624"></script>
  <script src="llm-demo.js?v=20260614c"></script>
  <script defer src="../../aep-theme.js?v=20260421-fs-helper"></script>
  <script defer src="../../aep-theme-prefs.js?v=20260416d"></script>
  <script defer src="../../aep-lab-nav.js?v=20260603-llm-demo"></script>
</body>
</html>
