<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Starbucks — Rewards</title>
  <link rel="stylesheet" href="starbucks-mobile-app.css?v=20260622">
</head>
<body class="sb-mobile-app" data-starbucks-mobile-page="rewards">
  <div class="sb-mobile-shell">
    <header class="sb-mobile-header">
      <p class="sb-mobile-greeting">Starbucks Rewards</p>
      <h1>Earn &amp; redeem</h1>
    </header>
    <div class="sb-mobile-scroll">
      <section id="TopRibbon" aria-label="Personalized top ribbon" role="region"></section>
      <div class="sb-mobile-hero" data-hero-mount data-hero-mount-fit="contain" aria-label="Rewards hero">
        <p class="sb-mobile-hero-kicker">Double Star Tuesday</p>
        <p class="sb-mobile-hero-stars">Earn 2× Stars on handcrafted beverages</p>
      </div>
      <section aria-labelledby="sb-rewards-tiers">
        <h2 class="sb-mobile-section-title" id="sb-rewards-tiers">Membership tiers</h2>
        <div id="sbMobileRewardsTiers"></div>
      </section>
      <section id="ContentCardContainer" class="ContentCardContainer" aria-label="Content cards" role="region"></section>
    </div>
    <nav class="sb-mobile-tabbar" id="sbMobileTabBar" aria-label="App navigation"></nav>
  </div>
  <script src="../starbucks-mock-data.js?v=20260622"></script>
  <script src="starbucks-mobile-app.js?v=20260622"></script>
</body>
</html>
