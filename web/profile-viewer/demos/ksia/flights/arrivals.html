<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrivals — King Salman International Airport</title>
  <link rel="stylesheet" href="../ksia-site.css?v=20260612e">
</head>
<body class="ksia-site" data-ksia-page-id="flights-arrivals" data-ksia-nav-section="flights" data-ksia-context="flights-arrivals pickup meet-and-greet" data-ksia-journey-stage="pre-trip">
  <div id="ksia-chrome-mount"></div>
  <main class="ksia-main" id="ksia-main">

    <section class="ksia-board-hero" aria-label="Arrivals board">
      <div class="ksia-board-hero-inner">
        <h1 class="ksia-board-hero-title">Arrivals</h1>
        <div class="ksia-board-hero-meta">
          <span class="ksia-board-updated" id="ksiaBoardUpdated">Last updated —</span>
          <span class="ksia-board-hero-pill">Pickup &amp; meet context</span>
        </div>
        <form class="ksia-board-filters" id="ksiaBoardFilters" aria-label="Filter arrivals" onsubmit="return false;">
          <div class="ksia-board-filter-field">
            <label for="ksiaFilterAirline">Airline</label>
            <select id="ksiaFilterAirline" name="airline"></select>
          </div>
          <div class="ksia-board-filter-field">
            <label for="ksiaFilterFlight">Flight no.</label>
            <input id="ksiaFilterFlight" name="flight" type="text" placeholder="e.g. SV 456" autocomplete="off">
          </div>
          <div class="ksia-board-filter-field">
            <label for="ksiaFilterPlace">Origin</label>
            <input id="ksiaFilterPlace" name="origin" type="text" placeholder="City or airport" autocomplete="off">
          </div>
          <button type="button" class="ksia-board-filter-reset" id="ksiaFilterReset">Clear filters</button>
        </form>
      </div>
    </section>

    <section class="ksia-section ksia-section--white" aria-labelledby="ksia-arrivals-board-heading">
      <h2 class="ksia-section-title" id="ksia-arrivals-board-heading">Live arrivals board</h2>
      <div class="ksia-board-table-wrap" id="ksiaBoardTable"></div>
      <p class="ksia-board-empty" id="ksiaBoardEmpty" hidden>No flights match your filters.</p>
    </section>

    <section class="ksia-section ksia-section--sunlit" aria-label="Assistant suggestions">
      <div id="ksiaBoardAssistant"></div>
    </section>

    <section class="ksia-section ksia-section--sand ksia-board-related" aria-labelledby="ksia-arrivals-related-heading">
      <h2 class="ksia-section-title" id="ksia-arrivals-related-heading">Related</h2>
      <div id="ksiaBoardRelated"></div>
    </section>

  </main>
  <script src="../ksia-mock-data.js?v=20260612e"></script>
  <script src="../ksia-events.js?v=20260612"></script>
  <script src="../ksia-chrome.js?v=20260612b"></script>
  <script src="../ksia-journey-chrome.js?v=20260623-env-inline" defer></script>
  <script src="../ksia-board-pages.js?v=20260612e"></script>
</body>
</html>
