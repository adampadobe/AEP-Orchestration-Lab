<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About KSIA — King Salman International Airport</title>
  <link rel="stylesheet" href="ksia-site.css?v=20260613a">
</head>
<body class="ksia-site" data-ksia-page-id="about" data-ksia-context="about">
  <div id="ksia-chrome-mount"></div>
  <main class="ksia-main" id="ksia-main">

    <section class="ksia-subpage-hero" aria-labelledby="ksia-about-heading">
      <h1 class="ksia-page-title" id="ksia-about-heading">About KSIA</h1>
      <p class="ksia-subpage-hero-lead" id="ksiaAboutVisionLead"></p>
    </section>

    <section class="ksia-section ksia-section--white" aria-labelledby="ksia-about-stats-heading">
      <h2 class="ksia-section-title" id="ksia-about-stats-heading">At a glance</h2>
      <div class="ksia-about-stats" id="ksiaAboutStats"></div>
    </section>

    <section class="ksia-section ksia-section--sunlit" aria-label="Vision 2030 gateway">
      <div class="ksia-gallery">
        <div class="ksia-gallery-panel ksia-gallery-panel--hero">
          <img src="assets/gallery-gate.png" alt="King Salman International Airport terminal" width="800" height="500">
          <div class="ksia-gallery-caption">
            <h3>The Kingdom's Global Gateway</h3>
            <p>A functional &amp; iconic destination, acting as KSA's access gateway.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="ksia-section ksia-section--sand" aria-labelledby="ksia-about-pillars-heading">
      <h2 class="ksia-section-title" id="ksia-about-pillars-heading">Vision 2030 pillars</h2>
      <div class="ksia-about-pillars" id="ksiaAboutPillars"></div>
    </section>

    <section class="ksia-section ksia-section--white" aria-labelledby="ksia-about-aivc-heading">
      <p class="ksia-section-kicker">Innovation</p>
      <h2 class="ksia-display-heading" id="ksia-about-aivc-heading"><span id="ksiaAboutAivcTitle">Powered by AIVC</span></h2>
      <p class="ksia-body-text" id="ksiaAboutAivcLead" style="max-width:640px;margin-bottom:20px"></p>
      <a href="aivc/index.html" class="ksia-btn ksia-btn-primary" id="ksiaAboutAivcCta">Explore AIVC companion</a>
    </section>

    <section class="ksia-section ksia-section--sand" aria-labelledby="ksia-about-concierge-heading">
      <div class="ksia-aivc-concierge-band">
        <h2 class="ksia-display-heading" id="ksia-about-concierge-heading" style="color:var(--ksia-warm-gold);margin-bottom:12px"><span id="ksiaAboutConciergeTitle">Concierge-ready</span></h2>
        <p id="ksiaAboutConciergeLead"></p>
        <button type="button" class="ksia-btn ksia-btn-primary" id="ksiaAboutConciergeCta">Open AIVC concierge (mock)</button>
      </div>
    </section>

  </main>
  <script src="ksia-mock-data.js?v=20260613a"></script>
  <script src="ksia-events.js?v=20260612"></script>
  <script src="ksia-chrome.js?v=20260612b"></script>
  <script src="ksia-journey-chrome.js?v=20260623-env-inline" defer></script>
  <script src="ksia-info-pages.js?v=20260613a"></script>
</body>
</html>
